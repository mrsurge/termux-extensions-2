<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; frame-src 'none'; base-uri 'none'">
  <link rel="stylesheet" href="./chrome.css">
  <title>TE2 Termux toolbar</title>
</head>
<body>
  <nav aria-label="Application toolbar">
    <button type="button" data-action="home" aria-label="Home" title="Home">⌂</button>
    <button type="button" data-action="reload" aria-label="Reload" title="Reload">↻</button>
    <span id="chrome-title" title="TE2 Termux">TE2 Termux</span>
    <button type="button" data-action="scale-down" aria-label="Decrease UI scale" title="Decrease UI scale">−</button>
    <button type="button" data-action="scale-reset" aria-label="Reset UI scale" title="Reset UI scale to 100%">100%</button>
    <button type="button" data-action="scale-up" aria-label="Increase UI scale" title="Increase UI scale">+</button>
    <button type="button" data-action="recents" aria-label="Recent apps" title="Recent apps"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="6" width="11" height="11" rx="1"/><path d="M6 3h11v11"/></svg></button>
    <button type="button" data-action="quit">Quit</button>
    <button type="button" data-action="tools" aria-label="Tools" title="Tools">⚒</button>
  </nav>
  <div id="chrome-error" role="status" aria-live="polite"></div>
  <script type="module" src="./chrome.js"></script>
</body>
</html>
