<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TE2 Desktop</title>
  <link rel="stylesheet" href="./index.css">
  <link rel="stylesheet" href="header-actions.css">
</head>
<body>
  <header id="desktop-header" class="desktop-header electron-app-region-drag">
    <nav class="header-group electron-app-region-no-drag" aria-label="Navigation">
      <button id="home" title="Home" aria-label="Home">⌂</button>
      <button id="devtools" title="Toggle floating DevTools" aria-label="Toggle floating DevTools" hidden><span class="action-label">DevTools</span><svg class="action-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4h18v16H3z M6 9l3 3-3 3 M12 15h5"/></svg></button>
      <button id="reload" title="Reload" aria-label="Reload">↻</button>
    </nav>
    <div class="header-title">
      <span id="page-title">TE2 Desktop</span>
      <button id="asset-version" class="asset-version" type="button" title="Update local assets and reload active views" aria-label="Update local assets">Assets unavailable</button>
      <button id="framework-offline" class="framework-offline" type="button" hidden>
        Framework offline — Launcher
      </button>
    </div>
    <nav class="header-group app-actions electron-app-region-no-drag" aria-label="Application">
      <button id="zoom-out" title="Zoom out">−</button>
      <button id="zoom-reset" class="zoom-reset" title="Reset zoom">100%</button>
      <button id="zoom-in" title="Zoom in">+</button>
      <button id="recents" class="app-only" title="Recent apps" aria-label="Recent apps"><span class="action-label">Recents</span><svg class="action-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 7h13v13H3z M7 3h13v13"/></svg></button>
      <button id="quit-app" class="app-only danger" title="Quit current app" aria-label="Quit current app"><span class="action-label">Quit</span><svg class="action-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M10 4H4v16h6 M9 12h12 M16 7l5 5-5 5"/></svg></button>
    </nav>
    <nav class="window-controls electron-app-region-no-drag" aria-label="Window">
      <button id="minimize-window" title="Minimize" aria-label="Minimize">─</button>
      <button id="maximize-window" title="Maximize" aria-label="Maximize">□</button>
      <button id="close-window" class="close-window" title="Close" aria-label="Close">×</button>
    </nav>
  </header>
  <main id="view-stack" class="view-stack">
    <iframe id="launcher-view" src="about:blank" title="TE2 applications"></iframe>
  </main>
  <div id="native-toast" class="native-toast" role="status" aria-live="polite"></div>
  <script type="module" src="./index.js"></script>
</body>
</html>
