<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile IDE Shell</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header id="chrome">
    <button id="btn-ham" title="Explorer">☰</button>
    <div class="title">Mobile IDE</div>
    <div class="spacer"></div>
    <button id="btn-search" title="Search">🔎</button>
    <button id="btn-cmd" title="Command Palette">⌘</button>
    <button id="btn-settings" title="Settings">⚙</button>
  </header>

  <main id="stage">
    <iframe id="ide" src="{{ code_iframe_url }}" frameborder="0"></iframe>
  </main>

  <nav id="tabs">
    <button data-tab="explorer">Explorer</button>
    <button data-tab="terminal">Terminal</button>
    <button data-tab="problems">Problems</button>
    <button data-tab="output">Output</button>
    <div class="spacer"></div>
    <label class="chat-label">
      Chat:
      <select id="chat-provider">
        <option value="terminal">Terminal</option>
        <option value="problems">Problems</option>
        <!-- add your chat view ids here via runtime -->
      </select>
    </label>
  </nav>

  <script>
    window.CODE_IFRAME_URL = "{{ code_iframe_url }}";
  </script>
  <script type="module" src="{{ url_for('static', filename='js/shell.js') }}"></script>
</body>
</html>
