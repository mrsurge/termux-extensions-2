[build-system]
requires = ["setuptools>=82", "wheel>=0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "te2"
version = "0.2.342"
description = "TE2 framework runtime and tooling"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
te2 = "app.cli.run_rust_framework:main"
te2-rust = "app.cli.run_rust_framework:main"
te2-desktop = "desktop_client.electron_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"app" = [
    "android_editor_assets_bundle.json",
    "android_shell/**/*",
    "static/**/*",
    "templates/**/*",
    "extensions/**/*",
    "apps/**/*",
]
"app.apps.code_te2" = [
    "vendor/node_socketio/**/*",
    "vendor/picomatch/**/*",
]
"app.release_runtime" = [
    "provenance.json",
    "bin/*",
]
"desktop_client" = [
    "desktop_asset_inventory.json",
    "android_shell/**/*",
    "electron/build.mjs",
    "electron/package-lock.json",
    "electron/package.json",
    "electron/package.mjs",
    "electron/tsconfig.json",
    "electron/src/**/*",
]

[tool.setuptools.exclude-package-data]
"app" = [
    "apps/code_te2/node_modules",
    "apps/code_te2/node_modules/**/*",
    "apps/terminal/node_modules",
    "apps/terminal/node_modules/**/*",
]
"desktop_client" = [
    "electron/src/**/*.test.ts",
    "electron/*.heapsnapshot",
    "electron/*.jsonl",
    "electron/python-*.json",
    "electron/*.tracemalloc",
    "electron/te2-server.heaptrack*",
]

[tool.setuptools.data-files]
"te2/framework/bootstrap" = [
    "framework/bootstrap/*.py",
]
"te2/framework/rust" = [
    "framework/rust/Cargo.lock",
    "framework/rust/Cargo.toml",
]
"te2/framework/rust/crates/te2-server" = [
    "framework/rust/crates/te2-server/Cargo.toml",
]
"te2/framework/rust/crates/te2-server/src" = [
    "framework/rust/crates/te2-server/src/*.rs",
]
"te2/framework/rust/crates/te2-server/src/framework_services" = [
    "framework/rust/crates/te2-server/src/framework_services/*.rs",
]
"te2/framework/rust/crates/te2-server/src/framework_services/net" = [
    "framework/rust/crates/te2-server/src/framework_services/net/*.rs",
]
"te2/framework/rust/crates/te2-server/src/framework_services/pipe" = [
    "framework/rust/crates/te2-server/src/framework_services/pipe/*.rs",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "desktop_client*"]
exclude = [
    "app.apps.code_te2.node_modules",
    "app.apps.code_te2.node_modules.*",
    "app.apps.terminal.node_modules",
    "app.apps.terminal.node_modules.*",
    "desktop_client.android_shell",
    "desktop_client.android_shell.*",
    "desktop_client.electron",
    "desktop_client.electron.*",
]
namespaces = true

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
