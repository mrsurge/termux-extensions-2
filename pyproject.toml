[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "te2"
version = "0.2.176"
description = "TE2 framework runtime and tooling"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
te2 = "app.cli.run_framework:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"app" = [
    "static/**/*",
    "apps/**/*",
]
"app.apps.file_editor_cm6" = [
    "vendor/node_socketio/**/*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = [
    "app.apps.file_editor_cm6.node_modules",
    "app.apps.file_editor_cm6.node_modules.*",
]
namespaces = true

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
