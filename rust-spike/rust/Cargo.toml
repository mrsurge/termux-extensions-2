[workspace]
members = [
    "crates/te2-rust-spike-server",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
ferrous_framework = { git = "https://github.com/mrsurge/ferrous-framework.git", rev = "673c156" }
futures-util = "0.3"
getrandom = "0.3"
git2 = "0.20"
glob = "0.3"
globset = "0.4.18"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
ignore = "0.4.26"
ipnet = "2"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false }
socketioxide = { version = "0.18", features = ["state"] }
socket2 = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-tungstenite = "0.29"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
