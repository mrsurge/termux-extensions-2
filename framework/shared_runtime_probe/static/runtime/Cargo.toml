[package]
name = "te2-probe-runtime"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "../../src/runtime.rs"
crate-type = ["rlib"]

[dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "io-util"] }
hyper = { version = "=1.11.1", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.3"
flate2 = "=1.1.10"
