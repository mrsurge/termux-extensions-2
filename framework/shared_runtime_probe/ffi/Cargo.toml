[package]
name = "te2-probe-runtime-ffi"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "io-util"] }
hyper = { version = "=1.11.1", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.3"
flate2 = "=1.1.10"

[profile.release]
strip = "symbols"
