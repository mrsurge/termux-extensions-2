[package]
name = "te2-server"
version = "0.2.356"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["ferrous-framework-native", "native-mcp"]
ferrous-framework-native = ["dep:ferrous_framework"]
release-vendored-tls = ["git2/vendored-openssl"]
native-mcp = ["dep:rmcp", "serde_json/raw_value", "dep:tokio-util", "dep:http-body-util"]

[dependencies]
anyhow.workspace = true
http = "1"
axum.workspace = true
ferrous_framework = { workspace = true, optional = true }
futures-util.workspace = true
getrandom.workspace = true
git2.workspace = true
glob.workspace = true
globset.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
ipnet.workspace = true
libc.workspace = true
notify.workspace = true
regex.workspace = true
rmp-serde.workspace = true
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"], optional = true }
tokio-util = { version = "0.7", optional = true }
http-body-util = { version = "0.1", optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
serde_yaml.workspace = true
socketioxide.workspace = true
socket2.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zip.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
tower.workspace = true
http-body-util = "0.1"
flate2 = "1"
