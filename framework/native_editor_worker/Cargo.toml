[package]
name = "te2-native-editor-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# Deliberately independent of the production framework workspace.
[workspace]

[dependencies]
anyhow = "1"
pyo3 = { version = "=0.28.3", features = ["auto-initialize"] }
rmpv = { version = "=1.3.1", features = ["with-serde"] }
bytes = { version = "1", features = ["serde"] }
http-body-util = "0.1"
http = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["io"] }
socketioxide = "=0.18.3"
serde_json = "1"
mime_guess = "2"
percent-encoding = "2"
url = "2"
futures-util = "0.3"
tempfile = "=3.27.0"
ferrous_framework = { git = "https://github.com/mrsurge/ferrous-framework.git", rev = "f7ce06845c98196c45514552db4610347593bcae" }
serde_yaml = "0.9"
regex = "1"
tf-rust-socketio = "=0.8.1"

[[bin]]
name = "code-te2-worker"
path = "src/code_te2.rs"

[profile.dev]
debug = 1

[dev-dependencies]
flate2 = "1"
