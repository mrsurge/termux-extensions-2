org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# No android.aapt2FromMavenOverride here: the parent android/gradle.properties
# pins it to Termux's on-device aapt2 (/data/data/com.termux/files/usr/bin/aapt2),
# which does not exist on a desktop build host. This standalone build no longer
# inherits that file, so it resolves aapt2 from the Android SDK build-tools as
# normal. If Termux on-device builds of :cefrium are needed again, set the
# override with -P or a local, untracked gradle.properties, not here.
