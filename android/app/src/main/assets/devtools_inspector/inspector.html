<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    >
    <title>TE2 Developer Tools</title>
    <style>
      html,
      body,
      #devtools-root,
      #devtools-root iframe {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
        overflow: hidden;
        background: #292a2d;
      }

      #devtools-status {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #d7dae0;
        background: #292a2d;
        font: 14px/1.5 sans-serif;
        text-align: center;
      }

      #devtools-status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="devtools-root"></div>
    <div id="devtools-status">Waiting for inspected page...</div>
    <script src="inspector-runtime.js"></script>
  </body>
</html>
