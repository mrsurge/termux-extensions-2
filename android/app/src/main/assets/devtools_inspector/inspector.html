<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    >
    <title>TE2 Developer Tools</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
        overflow: hidden;
        background: #292a2d;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      #devtools-toolbar {
        display: none;
        flex: 0 0 auto;
        align-items: center;
        min-height: 34px;
        padding: 3px 8px;
        border-bottom: 1px solid #45464a;
        background: #202124;
      }

      #devtools-target {
        width: 100%;
        min-width: 0;
        min-height: 28px;
        color: #e8eaed;
        border: 1px solid #5f6368;
        border-radius: 4px;
        background: #292a2d;
      }

      #devtools-root {
        flex: 1 1 auto;
        min-height: 0;
      }

      #devtools-root,
      #devtools-root iframe {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
        overflow: hidden;
        background: #292a2d;
      }

      #devtools-status {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #d7dae0;
        background: #292a2d;
        font: 14px/1.5 sans-serif;
        text-align: center;
      }

      #devtools-status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="devtools-toolbar">
      <select id="devtools-target" aria-label="Inspected page target" disabled>
        <option>Waiting for inspected page...</option>
      </select>
    </div>
    <div id="devtools-root"></div>
    <div id="devtools-status">Waiting for inspected page...</div>
    <script src="inspector-runtime.js"></script>
  </body>
</html>
