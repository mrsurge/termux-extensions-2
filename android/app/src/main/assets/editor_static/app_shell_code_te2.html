    <style>
        :root {
            --background: hsl(224, 71%, 4%);
            --foreground: hsl(213, 31%, 91%);
            --card: hsl(224, 71%, 7%);
            --border: hsl(216, 34%, 17%);
            --primary: hsl(217, 91%, 60%);
            --secondary: hsla(220, 18%, 16%, 1.00);
            --muted-foreground: hsl(215, 13%, 65%);
            --te-shell-viewport-height: 100vh;
            --te-app-container-height: 100vh;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow: hidden;
        }
        body {
            background-color: var(--background);
            color: var(--foreground);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            min-height: var(--te-shell-viewport-height, 100dvh);
        }
        .app-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            height: var(--te-shell-viewport-height, 100dvh);
            overflow: hidden;
        }
        .app-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--card); position: sticky; top: 0; z-index: 5; }
        html.gv-native .app-toolbar { display: none; }
        html.te-embed .app-toolbar { display: none; }
        .app-title { font-weight: 600; margin-left: 6px; color: var(--foreground); font-size: 0.95rem; max-width: 45vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .spacer { flex: 1; }
        .app-btn { background: var(--secondary); color: var(--foreground); border: 1px solid var(--border); border-radius: 1px; padding: 6px 10px; cursor: pointer; }
        .app-btn:hover { border-color: var(--primary); }
        #app-container {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        .app-readiness-placeholder {
            min-height: 100%;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
            text-align: left;
            background: var(--background);
        }

        .app-readiness-card {
            width: min(360px, 100%);
            border: 1px solid var(--border);
            border-radius: 2px;
            background: var(--card);
            padding: 16px 18px;
            box-shadow: none;
        }

        .app-readiness-kicker {
            color: var(--muted-foreground);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .app-readiness-title {
            font-size: 1rem;
            font-weight: 700;
            margin: 0;
        }

        .app-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .app-modal-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: min(500px, 90vw);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
        }
        .app-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
        }
        .app-modal-header h3 { margin: 0; }
        .app-modal-actions { display: flex; align-items: center; gap: 8px; }
        .app-modal-body {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .recents-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--secondary);
            padding: 12px;
            border-radius: 2px;
            border: 1px solid var(--border);
        }
        .recents-icon {
            font-size: 1.5rem;
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
        }
        .recents-icon-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .recents-info { flex: 1; }
        .recents-name { font-weight: 600; }
        .recents-stats {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--muted-foreground);
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .recents-card.locked {
            border-color: var(--success);
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.35);
            background: rgba(34, 197, 94, 0.1);
        }

        .recents-card-quit-btn {
            position: absolute;

            border-radius: 2%;
            background: rgba(80, 120, 255, 0.2);
            color: var(--primary-foreground);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;

        .recents-card-lock-btn {

            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

    <script>
    // Native Android: persist renderer mode across navigation so we never show two headers.
    (function () {
        let enabled = false;
        let embed = false;
        try {
            const p = new URLSearchParams(location.search);
            if (p.get('gv_native') === '1') {
                enabled = true;
                sessionStorage.setItem('te_gv_native', '1');
            } else if (sessionStorage.getItem('te_gv_native') === '1') {
                enabled = true;
            }

            const renderer = (p.get('te2_renderer') || '').trim().toLowerCase();
            if (renderer === 'gecko' || renderer === 'cefrium') {
                sessionStorage.setItem('te_android_renderer', renderer);
            } else if (p.has('te2_renderer')) {
                sessionStorage.removeItem('te_android_renderer');
            }

            // iframe embed mode (used by the TE2 side-bar shortcuts)
            const embedParam = p.get('embed');
            if (embedParam === '1' || embedParam === 'true') {
                embed = true;
            }
        } catch (e) {}

        if (enabled) {
            document.documentElement.classList.add('gv-native');
            try { console.log('[app_shell] gv-native enabled'); } catch (e) {}
        }

        // Native Android shells use their OTA asset layer and must not be controlled by the PWA worker.
        window.teNativeServiceWorkerReady = enabled ? (async function () {
            if (!('serviceWorker' in navigator)) return true;

            const wasControlled = navigator.serviceWorker.controller !== null;
            try {
                const registrations = await navigator.serviceWorker.getRegistrations();
                await Promise.all(registrations.map(registration => registration.unregister()));

                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(
                        cacheNames
                            .filter(name => name.startsWith('te2-v'))
                            .map(name => caches.delete(name))
                    );
                }
            } catch (error) {
                console.warn('[app_shell] native service worker cleanup failed:', error);
            }

            const reloadKey = 'te_gv_native_sw_reloaded';
            if (wasControlled && sessionStorage.getItem(reloadKey) !== '1') {
                sessionStorage.setItem(reloadKey, '1');
                location.reload();
                return false;
            }

            sessionStorage.removeItem(reloadKey);
            return true;
        })() : Promise.resolve(true);

        if (embed) {
            document.documentElement.classList.add('te-embed');
            try { console.log('[app_shell] embed enabled'); } catch (e) {}
        }
    })();

    // Called by GeckoView native header to open the existing web Recents modal if present.
    window.teOpenRecentsModal = function () {
        const btn = document.getElementById('btn-recents');
        if (!btn) return false;
        btn.click();
        return true;
    };
    </script>

    <script>
    let appShellMetricsRaf = 0;
    const DEFAULT_VIEWPORT_CONTENT = 'width=device-width, initial-scale=1.0, interactive-widget=resizes-content';
    const LOCKED_VIEWPORT_CONTENT = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content';

    function resolveAppShellMode() {
        const root = document.documentElement;
        const isNativeLike = root.classList.contains('gv-native') || root.classList.contains('te-embed');
        const standaloneMatch = typeof window.matchMedia === 'function'
            && (window.matchMedia('(display-mode: standalone)').matches
                || window.matchMedia('(display-mode: minimal-ui)').matches);
        const isStandalone = !isNativeLike && (standaloneMatch || window.navigator.standalone === true);
        const coarsePointer = typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches;
        return !isNativeLike && !isStandalone && coarsePointer ? 'mobile-tab' : 'stable';
    }

    function syncViewportMetaForShellMode(shellMode) {
        const viewportMeta = document.getElementById('app-shell-viewport');
        if (!(viewportMeta instanceof HTMLMetaElement)) return;
        const nativeShell = document.documentElement.classList.contains('gv-native');
        const nextContent = nativeShell || shellMode === 'mobile-tab'
            ? LOCKED_VIEWPORT_CONTENT
            : DEFAULT_VIEWPORT_CONTENT;
        if (viewportMeta.getAttribute('content') !== nextContent) {
            viewportMeta.setAttribute('content', nextContent);
        }
    }

    // Framework toolbar and viewport tracking - expose as CSS variables for hosted apps
    function updateAppShellLayoutMetrics() {
        const root = document.documentElement;
        const toolbar = document.querySelector('.app-toolbar');
        const appContainer = document.getElementById('app-container');
        const shellMode = resolveAppShellMode();
        const visualViewport = window.visualViewport || null;
        const visualViewportHeight = visualViewport && Number.isFinite(visualViewport.height)
            ? visualViewport.height
            : null;
        const visualViewportOffsetTop = visualViewport && Number.isFinite(visualViewport.offsetTop)
            ? visualViewport.offsetTop
            : 0;
        const viewportExtent = visualViewportHeight != null
            ? visualViewportHeight + visualViewportOffsetTop
            : null;
        const viewportHeight = Math.round(viewportExtent || window.innerHeight || document.documentElement.clientHeight || 0);

        root.dataset.shellMode = shellMode;
        syncViewportMetaForShellMode(shellMode);
        if (viewportHeight > 0) {
            root.style.setProperty('--te-shell-viewport-height', `${viewportHeight}px`);
        }
        if (
            toolbar
            && !root.classList.contains('gv-native')
            && !root.classList.contains('te-embed')
        ) {
            const height = toolbar.offsetHeight;
            root.style.setProperty('--framework-toolbar-height', `${height}px`);
        } else {
            root.style.setProperty('--framework-toolbar-height', `0px`);
        }
        if (appContainer) {
            const appContainerHeight = Math.round(appContainer.clientHeight || 0);
            if (appContainerHeight > 0) {
                root.style.setProperty('--te-app-container-height', `${appContainerHeight}px`);
            }
        }
    }

    function scheduleAppShellLayoutMetrics() {
        if (appShellMetricsRaf) return;
        appShellMetricsRaf = window.requestAnimationFrame(() => {
            appShellMetricsRaf = 0;
            updateAppShellLayoutMetrics();
        });
    }

    window.refreshAppShellLayoutMetrics = scheduleAppShellLayoutMetrics;

    // Run on load and resize
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', scheduleAppShellLayoutMetrics);
    } else {
        scheduleAppShellLayoutMetrics();
    }
    window.addEventListener('load', scheduleAppShellLayoutMetrics);
    window.addEventListener('resize', scheduleAppShellLayoutMetrics);
    window.visualViewport?.addEventListener('resize', scheduleAppShellLayoutMetrics);
    window.visualViewport?.addEventListener('scroll', scheduleAppShellLayoutMetrics);
    </script>
    
    <script type="module">
        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        const appContainer = document.getElementById('app-container');
        const appTitleEl = document.getElementById('app-title');
        const btnHome = document.getElementById('btn-home');
        const btnReload = document.getElementById('btn-reload');

        function resolveAppId() {
            const rawNode = document.getElementById('__app_id_json');
            if (rawNode) {
                const raw = rawNode.textContent || '';
                try {
                    const parsed = JSON.parse(raw);
                    if (typeof parsed === 'string' && parsed.trim()) return parsed.trim();
                } catch (_) {
                }
            }

            try {
                const params = new URLSearchParams(window.location.search);
                const queryId = params.get('app_id');
                if (queryId && queryId.trim()) return queryId.trim();
            } catch (_) {
            }

            try {
                const parts = window.location.pathname.split('/').filter(Boolean);
                if (parts.length >= 2 && parts[0] === 'app' && parts[1]) {
                    return decodeURIComponent(parts[1]);
                }
            } catch (_) {
            }

            return '';
        }

        const appId = resolveAppId();
        let debugFullStack = false;

        // Minimal teFetch helper for the app shell
        async function teFetch(url, options) {
            const response = await fetch(url, options);
            const body = await response.json().catch(() => ({}));
            if (!response.ok || !body.ok) {
                throw new Error(body.error || `HTTP ${response.status} - ${response.statusText}`);
            }
            return body.data;
        }

        function appRequiresBackend(appDef) {
            return !!(appDef && appDef.entrypoints && appDef.entrypoints.backend_blueprint);
        }

        function appSupportsReadiness(appDef) {
            return !!(appDef && appDef.readiness_support === true);
        }

        function normalizeReadinessStatus(readiness) {
            const raw = readiness && typeof readiness === 'object'
                ? String(readiness.status || '').trim().toLowerCase()
                : '';
            if (raw === 'loading') return 'starting';
            if (raw === 'ok' || raw === 'up' || raw === 'serving') return 'ready';
            return raw || 'starting';
        }

        function renderBackendReadinessPlaceholder(appDef, readiness) {
            const status = normalizeReadinessStatus(readiness);
            const appName = appDef?.name || appId || 'App';
            const kicker = status === 'error'
                ? 'App error'
                : status === 'stopped'
                    ? 'App stopped'
                    : 'Starting app';
            const title = status === 'error'
                ? `${appName} could not start`
                : status === 'stopped'
                    ? `${appName} stopped`
                    : `Preparing ${appName}`;
            appContainer.innerHTML = `
                <div class="app-readiness-placeholder" data-readiness-status="${escapeHtml(status)}">
                    <div class="app-readiness-card">
                        <div class="app-readiness-kicker">${escapeHtml(kicker)}</div>
                        <div class="app-readiness-title">${escapeHtml(title)}</div>
                    </div>
                </div>
            `;
        }

        // Rust lifecycle snapshots and readiness facts are the only release authority.
        async function waitForAppLifecycle() {
            renderBackendReadinessPlaceholder(null, { app_id: appId, status: 'starting' });
            let done = false;
            let events = null;
            let appDef = null;
            let bootstrapApp = null;

            function cleanup() {
                done = true;
                if (events) {
                    try { events.close(); } catch (_) {}
                    events = null;
                }
            }

            function extractCatalogApp(payload) {
                const catalog = Array.isArray(payload?.catalog) ? payload.catalog : [];
                return catalog.find((item) => String(item?.id || '').trim() === appId) || null;
            }

            function parseEventPayload(event) {
                try {
                    return JSON.parse(event.data);
                } catch (_) {
                    return null;
                }
            }

            function applyBootstrap(payload) {
                const bootstrap = payload?.app_bootstrap;
                if (!bootstrap || String(bootstrap.app_id || '').trim() !== appId) return;
                bootstrapApp = bootstrap.app && typeof bootstrap.app === 'object'
                    ? bootstrap.app
                    : null;
                debugFullStack = bootstrap.debug_full_stack === true;
                const bootstrapStateKey = String(bootstrap.state_key || '').trim();
                if (teStateStore && bootstrapStateKey === stateKey && typeof teStateStore.seed === 'function') {
                    teStateStore.seed(stateKey, bootstrap.state);
                    stateCache.set(stateKey, bootstrap.state);
                }
            }

            return await new Promise((resolve, reject) => {
                function resolveApp() {
                    const resolved = appDef;
                    cleanup();
                    resolve(resolved);
                }

                function applyReadiness(readiness) {
                    if (done || !appDef) return;
                    const status = normalizeReadinessStatus(readiness);
                    if (status === 'ready') {
                        resolveApp();
                        return;
                    }
                    renderBackendReadinessPlaceholder(appDef, readiness || { app_id: appId, status });
                }

                function applyCatalog(payload) {
                    if (done) return;
                    const match = extractCatalogApp(payload);
                    if (!match || !bootstrapApp) {
                        cleanup();
                        reject(new Error(`Lifecycle bootstrap for app "${appId}" is incomplete.`));
                        return;
                    }
                    appDef = {
                        ...match,
                        ...bootstrapApp,
                        readiness: match.readiness,
                    };
                    if (!appDef.entrypoints || typeof appDef.entrypoints.frontend_template !== 'string') {
                        cleanup();
                        reject(new Error(`Lifecycle bootstrap for app "${appId}" has no frontend entrypoint.`));
                        return;
                    }
                    host.setTitle(appDef.name || 'TE2 App');
                    if (!appRequiresBackend(appDef) || !appSupportsReadiness(appDef)) {
                        resolveApp();
                        return;
                    }
                    applyReadiness(appDef.readiness || { app_id: appId, status: 'starting' });
                }

                events = new EventSource(`/api/apps/events?app_id=${encodeURIComponent(appId)}`);
                for (const eventName of ['apps_snapshot', 'catalog_snapshot']) {
                    events.addEventListener(eventName, (event) => {
                        const payload = parseEventPayload(event);
                        if (payload) {
                            applyBootstrap(payload);
                            applyCatalog(payload);
                        }
                    });
                }
                events.addEventListener('app_readiness_changed', (event) => {
                    const payload = parseEventPayload(event) || {};
                    if (String(payload.app_id || '').trim() === appId && payload.readiness) {
                        applyReadiness(payload.readiness);
                    }
                });
                events.addEventListener('app_running_changed', (event) => {
                    const payload = parseEventPayload(event) || {};
                    if (String(payload.app_id || '').trim() === appId && payload.running === false) {
                        if (appDef) {
                            applyReadiness({ app_id: appId, status: 'stopped' });
                        } else {
                            renderBackendReadinessPlaceholder(null, { app_id: appId, status: 'stopped' });
                        }
                    }
                });
            });
        }

        async function waitForNativeAppPrerequisites(targetAppId) {
            const bridge = window.te2Electron;
            if (!bridge || typeof bridge.waitForAppPrerequisites !== 'function') return;
            await bridge.waitForAppPrerequisites(targetAppId);
        }

        function appLifecycleEndpoint(targetAppId, action) {
            return `/api/apps/${encodeURIComponent(String(targetAppId || '').trim())}/${action}`;
        }

        async function shutdownAppGroup(targetAppId) {
            if (!String(targetAppId || '').trim()) {
                throw new Error('Missing app id for quit');
            }
            return teFetch(appLifecycleEndpoint(targetAppId, 'quit'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: '{}',
            });
        }

        const teStateStore = window.teState || null;
        const stateCache = new Map();

        function getStateKey() { return `app_state:${appId}`; }
        const stateKey = getStateKey();

        function getCachedState(key, defaultValue = null) {
            if (stateCache.has(key)) {
                const value = stateCache.get(key);
                return value === undefined ? defaultValue : value;
            }
            if (teStateStore && teStateStore.has(key)) {
                const value = teStateStore.getSync(key, defaultValue);
                stateCache.set(key, value);
                return value;
            }
            return defaultValue;
        }

        function persistStateSet(key, value) {
            if (!teStateStore) return;
            const op = teStateStore.set(key, value);
            if (op && typeof op.catch === 'function') {
                op.catch((err) => console.warn('Failed to persist app state', err));
            }
        }

        function persistStateRemove(key) {
            if (!teStateStore) return;
            const op = teStateStore.remove(key);
            if (op && typeof op.catch === 'function') {
                op.catch((err) => console.warn('Failed to clear app state', err));
            }
        }

        // Host API exposed to apps
        const host = {
            id: appId,
            saveState: (state) => {
                stateCache.set(stateKey, state);
                persistStateSet(stateKey, state);
                return true;
            },
            loadState: (defaultValue = null) => {
                return getCachedState(stateKey, defaultValue);
            },
            clearState: () => {
                stateCache.delete(stateKey);
                persistStateRemove(stateKey);
            },
            setTitle: (title) => { document.title = title || 'TE2 App'; appTitleEl.textContent = title || 'App'; },
            onBeforeExit: (handler) => { window.__appBeforeExitHandler = handler; },
            toast: (msg) => { try { if (window.teUI && window.teUI.toast) window.teUI.toast(msg); } catch (_) {} },
        };

        async function attemptExit(navigateFn) {
            try {
                const handler = window.__appBeforeExitHandler;
                if (typeof handler === 'function') {
                    const res = await Promise.resolve(handler());
                    if (res && typeof res === 'object') {
                        if (res.cancel) return; // abort navigation
                        if ('state' in res) host.saveState(res.state);
                        else host.saveState(res);
                    } else if (res !== undefined) {
                        host.saveState(res);
                    }
                }
            } catch (e) {
                console.error('beforeExit handler error:', e);
            }
            await Promise.resolve(navigateFn());
        }

        window.addEventListener('beforeunload', (e) => {
            const handler = window.__appBeforeExitHandler;
            if (typeof handler === 'function') {
                try { const res = handler(); if (res && res.cancel) { e.preventDefault(); e.returnValue = ''; } } catch (_) {}
            }
        });

        const btnQuit = document.getElementById('btn-quit');
        const btnLock = document.getElementById('btn-lock');
        const btnRecents = document.getElementById('btn-recents');
        const recentsModal = document.getElementById('recents-modal');
        const recentsList = document.getElementById('recents-list');
        const recentsCloseBtn = document.getElementById('recents-close-btn');
        const recentsSettingsBtn = document.getElementById('recents-settings-btn');


        let isLocked = false; // Assume default is unlocked

        btnHome.addEventListener('click', () => attemptExit(() => { window.location.href = '/'; }));
        btnReload.addEventListener('click', () => attemptExit(() => { window.location.reload(); }));

        if (btnQuit) {
            btnQuit.addEventListener('click', () => {
                attemptExit(async () => {
                    try {
                        await shutdownAppGroup(appId);
                    } catch (err) {
                        console.error('Failed to send quit signal:', err);
                        host.toast(`Failed to quit app: ${err.message || err}`);
                    }
                    window.location.href = '/';
                });
            });
        }

        if (btnLock) {
            btnLock.addEventListener('click', () => {
                isLocked = !isLocked;
                const endpoint = isLocked ? 'lock' : 'unlock';
                fetch(`/api/apps/${appId}/${endpoint}`, { method: 'POST' })
                    .then(res => res.json())
                    .then(body => {
                        if (body.ok) {
                            host.toast(`App ${isLocked ? 'locked' : 'unlocked'}`);
                            btnLock.textContent = isLocked ? 'Unlock' : 'Lock';
                        } else {
                            host.toast(`Error: ${body.error}`);
                            isLocked = !isLocked; // Revert state on failure
                        }
                    })
                    .catch(err => {
                        host.toast(`Error: ${err.message}`);
                        isLocked = !isLocked; // Revert state on failure
                    });
            });
        }

        if (btnRecents) {
            const formatUptime = (seconds) => {
                if (seconds < 60) return `${Math.floor(seconds)}s`;
                if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
                return `${Math.floor(seconds / 3600)}h`;
            };
            const formatRam = (bytes) => {
                if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
                return `${(bytes / (1024 * 1024)).toFixed(0)} MB`;
            };
            const withGvNative = (url) => {
                try {
                    if (!document.documentElement.classList.contains('gv-native')) return url;
                    const u = new URL(url, location.origin);
                    u.searchParams.set('gv_native', '1');
                    const currentParams = new URLSearchParams(location.search);
                    const explicitRenderer = (currentParams.get('te2_renderer') || '')
                        .trim()
                        .toLowerCase();
                    const renderer = explicitRenderer === 'gecko' || explicitRenderer === 'cefrium'
                        ? explicitRenderer
                        : sessionStorage.getItem('te_android_renderer');
                    if (renderer === 'gecko' || renderer === 'cefrium') {
                        u.searchParams.set('te2_renderer', renderer);
                    }
                    return u.pathname + u.search;
                } catch (e) {
                    return url;
                }
            };
            const resolveIconSrc = (app) => {
                const raw = typeof app.icon_src === 'string' ? app.icon_src.trim() : '';
                if (!raw) return '';
                if (raw.startsWith('http://') || raw.startsWith('https://') || raw.startsWith('/')) {
                    return raw;
                }
                const assetBaseUrl = typeof app.asset_base_url === 'string' ? app.asset_base_url.trim() : '';
                if (assetBaseUrl) {
                    return `${assetBaseUrl.replace(/\/+$/, '')}/${raw.replace(/^\/+/, '')}`;
                }
                if (app._dir) {
                    return `/apps/${app._dir}/${raw}`;
                }
                return raw;
            };
            const resolveIconText = (app) => {
                const text = typeof app.icon_text === 'string' ? app.icon_text.trim() : '';
                if (text) return text;
                const emoji = typeof app.icon_emoji === 'string' ? app.icon_emoji.trim() : '';
                if (emoji) return emoji;
                return '⚙️';
            };

            btnRecents.addEventListener('click', async () => {
                try {
                    const runningApps = await teFetch('/api/apps/running');
                    recentsList.innerHTML = '';
                    if (runningApps && runningApps.length > 0) {
                        runningApps.forEach(app => {
                            const card = document.createElement('div');
                            card.className = 'recents-card';
                            if (app.locked) {
                                card.classList.add('locked');
                            }
                            card.dataset.appId = app.app_id;
                            card.dataset.shellId = app.shell_id;
                            card.style.position = 'relative'; // For positioning the quit button

                            // Add main click listener for app switching
                            card.addEventListener('click', () => {
                                const targetAppId = card.dataset.appId;
                                if (targetAppId) {
                                    recentsModal.style.display = 'none';
                                    window.location.href = withGvNative(`/app/${targetAppId}`);
                                }
                            });

                            card.innerHTML = `
                                <button class="recents-card-quit-btn" title="Quit App">❌</button>
                                <div class="recents-icon"></div>
                                <div class="recents-info">
                                    <div class="recents-name">${app.name || app.app_id}</div>
                                    <div class="recents-stats">
                                        <span>Uptime: ${formatUptime(app.uptime)}</span>
                                        <span>CPU: ${app.cpu.toFixed(1)}%</span>
                                        <span>RAM: ${formatRam(app.ram)}</span>
                                    </div>
                                </div>
                                <button class="recents-card-lock-btn" title="Toggle Lock">🔒</button>
                            `;
                            const iconContainer = card.querySelector('.recents-icon');
                            const iconSrc = resolveIconSrc(app);
                            if (iconContainer) {
                                if (iconSrc) {
                                    const img = document.createElement('img');
                                    img.className = 'recents-icon-img';
                                    img.alt = `${app.name || app.app_id || 'app'} icon`;
                                    img.src = iconSrc;
                                    img.loading = 'lazy';
                                    img.decoding = 'async';
                                    img.referrerPolicy = 'no-referrer';
                                    iconContainer.appendChild(img);
                                } else {
                                    iconContainer.textContent = resolveIconText(app);
                                }
                            }
                            recentsList.appendChild(card);
                        });

                        // Add event listeners for the new buttons
                        recentsList.querySelectorAll('.recents-card-quit-btn').forEach(btn => {
                            btn.addEventListener('click', async (e) => {
                                e.stopPropagation();
                                const card = btn.closest('.recents-card');
                                const appIdToQuit = card.dataset.appId;
                                if (appIdToQuit && await window.teUI.dialog.confirm(`Quit ${appIdToQuit}? This will override any lock.`)) {
                                    shutdownAppGroup(appIdToQuit)
                                        .then(() => card.remove())
                                        .catch(err => host.toast(`Error: ${err.message || err}`));
                                }
                            });
                        });

                        recentsList.querySelectorAll('.recents-card-lock-btn').forEach(btn => {
                            btn.addEventListener('click', async (e) => {
                                e.stopPropagation();
                                const card = btn.closest('.recents-card');
                                const appIdToToggle = card.dataset.appId;
                                const isCurrentlyLocked = card.classList.contains('locked');
                                const endpoint = isCurrentlyLocked ? 'unlock' : 'lock';
                                
                                try {
                                    await teFetch(`/api/apps/${appIdToToggle}/${endpoint}`, { method: 'POST' });
                                    // Re-render the list to show the change immediately
                                    btnRecents.click(); 
                                } catch (err) {
                                    host.toast(`Error: ${err.message}`);
                                }
                            });
                        });

                        const exitAllBtn = document.createElement('button');
                        exitAllBtn.className = 'recents-exit-all-btn';
                        exitAllBtn.innerHTML = '<span>❌</span> Exit All Apps';
                        exitAllBtn.addEventListener('click', async () => {
                            if (!(await window.teUI.dialog.confirm('Are you sure you want to exit all unlocked apps?'))) return;
                            try {
                                const runningApps = await teFetch('/api/apps/running');
                                const unlockedApps = runningApps.filter(app => !app.locked);
                                for (const app of unlockedApps) {
                                    await shutdownAppGroup(app.app_id);
                                }
                                recentsModal.style.display = 'none';
                            } catch (err) {
                                host.toast(`Error: ${err.message}`);
                            }
                        });
                        recentsList.appendChild(exitAllBtn);

                    } else {
                        recentsList.innerHTML = '<p style="color: var(--muted-foreground);">No other apps are running.</p>';
                    }
                    recentsModal.style.display = 'flex';
                } catch (err) {
                    host.toast(`Error: ${err.message}`);
                }
            });

            recentsCloseBtn.addEventListener('click', () => {
                recentsModal.style.display = 'none';
            });
            recentsSettingsBtn?.addEventListener('click', () => {
                recentsModal.style.display = 'none';
                window.location.href = withGvNative('/app/settings');
            });
        }

        function sidebarShortcutVersion() {
            try {
                return new URLSearchParams(window.location.search).get('te2_sidebar_version') || '';
            } catch (_) {
                return '';
            }
        }

        function withSidebarShortcutVersion(rawUrl, version, baseUrl) {
            if (!version || !rawUrl || typeof rawUrl !== 'string') return rawUrl;
            const trimmed = rawUrl.trim();
            if (!trimmed || trimmed.startsWith('#') || /^(?:data|blob|javascript|mailto|tel):/i.test(trimmed)) {
                return rawUrl;
            }
            try {
                const parsed = new URL(trimmed, baseUrl || window.location.href);
                if (parsed.origin !== window.location.origin) return rawUrl;
                parsed.searchParams.set('te2_sidebar_version', version);
                return `${parsed.pathname}${parsed.search}${parsed.hash}`;
            } catch (_) {
                return rawUrl;
            }
        }

        function rewriteSrcsetWithSidebarShortcutVersion(value, version, baseUrl) {
            if (!version || !value || typeof value !== 'string') return value;
            return value.split(',').map(candidate => {
                const trimmed = candidate.trim();
                if (!trimmed) return candidate;
                const match = trimmed.match(/^(\S+)(\s+.*)?$/);
                if (!match) return candidate;
                const rewritten = withSidebarShortcutVersion(match[1], version, baseUrl);
                return `${rewritten}${match[2] || ''}`;
            }).join(', ');
        }

        function rewriteTemplateVersionedAssets(templateText, templateUrl, version) {
            if (!version) return templateText;
            try {
                const templateElement = document.createElement('template');
                templateElement.innerHTML = templateText;
                const baseUrl = new URL(templateUrl, window.location.origin).toString();
                templateElement.content.querySelectorAll('link[href]').forEach(el => {
                    const raw = el.getAttribute('href') || '';
                    const next = withSidebarShortcutVersion(raw, version, baseUrl);
                    if (next !== raw) el.setAttribute('href', next);
                });
                templateElement.content.querySelectorAll('script[src], img[src], source[src]').forEach(el => {
                    const raw = el.getAttribute('src') || '';
                    const next = withSidebarShortcutVersion(raw, version, baseUrl);
                    if (next !== raw) el.setAttribute('src', next);
                });
                templateElement.content.querySelectorAll('img[srcset], source[srcset]').forEach(el => {
                    const raw = el.getAttribute('srcset') || '';
                    const next = rewriteSrcsetWithSidebarShortcutVersion(raw, version, baseUrl);
                    if (next !== raw) el.setAttribute('srcset', next);
                });
                return templateElement.innerHTML;
            } catch (_) {
                return templateText;
            }
        }

        async function loadApp() {
            try {
                if (!appId) throw new Error('App ID not available for app shell');
                const sidebarVersion = sidebarShortcutVersion();
                const appDef = await waitForAppLifecycle();
                await waitForNativeAppPrerequisites(appId);
                const assetBaseUrl = typeof appDef.asset_base_url === 'string' ? appDef.asset_base_url.trim() : '';
                const templatePath = assetBaseUrl
                    ? `${assetBaseUrl.replace(/\/+$/, '')}/${appDef.entrypoints.frontend_template.replace(/^\/+/, '')}`
                    : `/apps/${appDef._dir}/${appDef.entrypoints.frontend_template}`;
                const templateUrl = withSidebarShortcutVersion(templatePath, sidebarVersion, window.location.href);
                const template = await fetch(templateUrl, sidebarVersion ? { cache: 'reload' } : undefined).then(res => res.text());
                appContainer.innerHTML = rewriteTemplateVersionedAssets(template, templateUrl, sidebarVersion);
                window.refreshAppShellLayoutMetrics?.();

                if (appDef.entrypoints.frontend_script) {
                    const scriptPath = assetBaseUrl
                        ? `${assetBaseUrl.replace(/\/+$/, '')}/${appDef.entrypoints.frontend_script.replace(/^\/+/, '')}`
                        : `/apps/${appDef._dir}/${appDef.entrypoints.frontend_script}`;
                    const scriptUrl = withSidebarShortcutVersion(scriptPath, sidebarVersion, window.location.href);
                    const module = await import(scriptUrl);
                    const api = {
                        get: (endpoint) => teFetch(`/api/app/${appId}/${endpoint}`),
                        post: (endpoint, body) => teFetch(`/api/app/${appId}/${endpoint}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }),
                        delete: (endpoint) => teFetch(`/api/app/${appId}/${endpoint}`, { method: 'DELETE' })
                    };
                    // Pass host as a 3rd param (backward compatible)
                    const initResult = module.default(appContainer, api, host);
                    if (initResult && typeof initResult.then === 'function') {
                        await initResult;
                    }
                }
                window.refreshAppShellLayoutMetrics?.();
            } catch (error) {
                const details = debugFullStack && error?.stack ? error.stack : error.message;
                appContainer.innerHTML = `<pre style=\"color: red; white-space: pre-wrap;\">Error loading app: ${escapeHtml(details)}</pre>`;
                console.error("Failed to load app:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!await window.teNativeServiceWorkerReady) return;
            await loadApp();
        });
    </script>

        <script>
// Register Service Worker for PWA installability (app shell view)
if (!document.documentElement.classList.contains('gv-native') && 'serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
            console.error('Service worker registration failed:', err);
        });
    });
}
        </script>
</body>
