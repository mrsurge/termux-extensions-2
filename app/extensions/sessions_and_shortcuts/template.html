<div class="sas-root">
<div class="section-header">
    <div class="session-tabs">
        <button id="sas-tab-visible" class="session-tab">Interactive Sessions</button>
        <button id="sas-tab-framework" class="session-tab active">Framework Shells</button>
    </div>
    <div class="session-live-pill" title="Live updates via websocket">Live</div>
</div>
<div class="session-panels">
    <div id="sessions-visible" class="session-panel">
        <p class="session-empty" data-role="placeholder">Loading sessions...</p>
    </div>
    <div id="sessions-framework" class="session-panel active">
        <p class="session-empty" data-role="placeholder">Loading framework shells...</p>
    </div>
</div>
</div>

<!-- Modals -->
<div id="command-modal" class="modal">
    <div class="modal-content">
        <h2>Run Command</h2>
        <input type="text" id="command-input" class="modal-input" placeholder="Enter command...">
        <div class="modal-actions">
            <button id="run-command-btn" class="modal-btn btn-primary">Run</button>
            <button onclick="closeModal('command-modal')" class="modal-btn btn-secondary">Cancel</button>
        </div>
    </div>
</div>

<div id="rename-modal" class="modal">
    <div class="modal-content">
        <h2>Rename Session</h2>
        <input type="text" id="rename-input" class="modal-input" placeholder="New session name">
        <div class="modal-actions">
            <button id="rename-save-btn" class="modal-btn btn-primary">Save</button>
            <button onclick="closeModal('rename-modal')" class="modal-btn btn-secondary">Cancel</button>
        </div>
    </div>
<style>
    .session-tabs { display: flex; gap: 8px; align-items: center; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--muted-foreground); margin-right: 6px; }
    .status-dot.dot-green { background: var(--success); }
    .session-tab { background: var(--secondary); color: inherit; border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 0.9rem; }
    .session-tab.active { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
    .session-actions { display: flex; align-items: center; gap: 12px; }
    .session-panels { margin-top: 12px; }
    .session-panel { display: none; }
    .session-panel.active { display: block; }
    .session-empty { color: var(--muted-foreground); font-size: 0.9rem; }
    .session-live-pill {
        background: var(--primary);
        color: var(--primary-foreground);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
    }
    .session { position: relative; }
    .session.framework { border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: rgba(255,255,255,0.02); margin-bottom: 12px; }
    .session.framework .session-cwd { white-space: normal; word-break: break-word; overflow-wrap: anywhere; }
    
    /* App worker card styling */
    .session.framework.app-worker-card {
        border-color: var(--primary);
        border-width: 2px;
    }
	    .app-worker-badge {
	        background: var(--primary);
	        color: var(--primary-foreground);
	        padding: 2px 8px;
	        border-radius: 4px;
	        font-size: 0.7rem;
	        text-transform: uppercase;
	        letter-spacing: 0.05em;
	        margin-right: 8px;
	        cursor: pointer;
	        user-select: none;
	    }
	    .app-worker-badge:hover { text-decoration: underline; }
	    
	    /* Shell actions (log + kill buttons) */
	    .shell-actions {
	        display: flex;
	        gap: 6px;
        align-items: center;
    }
    .framework-log, .child-log {
        border: 1px solid var(--border);
        background: var(--secondary);
        color: inherit;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85rem;
    }
    .framework-log:hover, .child-log:hover { background: var(--muted); }
    .framework-kill, .child-kill {
        border: 1px solid var(--destructive);
        background: transparent;
        color: var(--destructive);
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: bold;
    }
    .framework-kill:hover, .child-kill:hover { background: var(--destructive); color: var(--destructive-foreground, #fff); }
    .framework-kill.kill-with-children {
        background: var(--destructive);
        color: var(--destructive-foreground, #fff);
    }
    .framework-purge {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted-foreground);
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85rem;
    }
    .framework-purge:hover { background: var(--muted); color: inherit; }
    .framework-group-kill {
        border: 1px solid var(--destructive);
        background: transparent;
        color: var(--destructive);
        padding: 2px 8px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: bold;
        line-height: 1.2;
    }
    .framework-group-kill:hover { background: var(--destructive); color: var(--destructive-foreground, #fff); }

    /* Shell grouping */
    .shell-group-header {
        margin: 18px 0 10px;
        padding: 6px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.03);
        font-size: 0.8rem;
        font-weight: 600;
        color: inherit;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }
    .shell-group-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shell-subgroup-header {
        margin: 10px 0 6px;
        padding-left: 6px;
        font-size: 0.8rem;
        color: var(--muted-foreground);
        opacity: 0.9;
    }
    .shell-subgroup-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 10px 0 6px;
        padding: 6px 8px;
        border-radius: 10px;
        background: var(--subgroup-bg, transparent);
        border: 1px solid var(--subgroup-border, transparent);
        color: var(--subgroup-color, inherit);
    }
    .shell-subgroup-row .shell-subgroup-header {
        margin: 0;
        padding-left: 0;
        color: inherit;
        opacity: 0.95;
    }
    .shell-subgroup-shells {
        margin-bottom: 8px;
        border-radius: 12px;
        padding: 6px;
        background: var(--subgroup-bg, transparent);
        border: 1px solid var(--subgroup-border, transparent);
        color: var(--subgroup-color, inherit);
    }
    .session.framework.nested-shell {
        margin: 8px 0;
        padding: 10px;
        background: rgba(255,255,255,0.015);
        border-color: rgba(255,255,255,0.08);
    }
    .shell-related { margin-top: 10px; }
    .session.framework.exited-shells-card {

    }
    .exited-shells-header {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted-foreground);
        padding: 6px 8px;
        border-radius: 8px;
        cursor: pointer;
        text-align: left;
        user-select: none;
    }

    .exited-shells-title { font-size: 0.9rem; }

    .exited-shells-list { margin-top: 10px; }
    .session.framework.exited-shell { opacity: 0.85; }
    
    /* Child processes tree */
    .shell-children {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dashed var(--border);
    }
    .children-header {
        font-size: 0.75rem;
        text-transform: uppercase;
        color: var(--muted-foreground);
        margin-bottom: 8px;
        letter-spacing: 0.05em;
    }
    .child-process {
        background: rgba(0,0,0,0.15);
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 6px;
        border-left: 3px solid var(--muted-foreground);
    }
    .child-process:last-child { margin-bottom: 0; }
    .child-header {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .child-label {
        font-weight: 500;
        flex: 1;
    }
    .child-type {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--muted-foreground);
        background: var(--secondary);
        padding: 2px 6px;
        border-radius: 3px;
    }
    .child-actions {
        display: flex;
        gap: 4px;
    }
    .child-info {
        font-size: 0.8rem;
        color: var(--muted-foreground);
        margin-top: 4px;
    }
    
    .session .menu { position: absolute; top: 36px; right: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,0.35); display: none; padding: 6px 0; min-width: 180px; z-index: 20; }
    .session .menu.open { display: block; }
    .session .menu .menu-item { border: none; background: transparent; color: inherit; width: 100%; text-align: left; padding: 8px 14px; font-size: 0.9rem; cursor: pointer; }
    .session .menu .menu-item:hover { background: rgba(255,255,255,0.05); }
    .session .menu .menu-item.destructive { color: var(--destructive); }
    .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
    /* Edge-to-edge: cancel the framework's extension-content padding for this extension only */
    .sas-root { margin: -16px; }
    .sas-root .session.framework { border-radius: 0; margin-left: 0; margin-right: 0; }
</style>
