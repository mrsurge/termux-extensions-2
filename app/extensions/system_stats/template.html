<!-- Extension Template: System Stats -->
<div class="stats-wrapper">
    <style>
        .stats-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 0;
            margin-left: -12px;
            margin-right: -12px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 12px;
        }

        /* System Info Card */
        .sys-info-card {
            background-color: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 0;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8em;
            color: var(--muted-foreground);
            line-height: 1.4;
            border-left: none;
            border-right: none;
        }
        .sys-info-header {
            color: var(--foreground);
            font-weight: 600;
            margin-bottom: 4px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* Standard Stat Cards */
        .stat-card {
            background-color: var(--secondary);
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .stat-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85em;
            color: var(--muted-foreground);
            margin-bottom: 4px;
        }
        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2em;
            font-weight: 600;
            color: var(--foreground);
        }
        .stat-subtext {
            font-size: 0.75em;
            color: var(--muted-foreground);
        }

        /* Horizontal Progress Bar */
        .progress-track {
            width: 100%;
            height: 6px;
            background-color: var(--muted);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            transition: none;
        }
        .fill-cpu { background-color: var(--accent); }
        .fill-mem { background-color: var(--warning); }

        /* Vertical CPU Core Bars */
        .cores-container {
            grid-column: span 2;
            background-color: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
        }
        .cores-grid {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 60px;
            gap: 4px;
            margin-top: 8px;
        }
        .core-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            min-width: 8px;
        }
        .core-bar-track {
            width: 100%;
            height: 100%;
            background-color: rgba(255,255,255,0.05);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }
        .core-bar-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--accent);
            opacity: 0.8;
            transition: none;
        }
        /* Gradient color for high load */
        .core-bar-fill.high-load { background-color: var(--destructive); }
        .core-bar-fill.med-load { background-color: var(--warning); }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--muted); }
        .dot-green { background-color: var(--success); }
        .dot-blue { background-color: var(--accent); }
    </style>

    <!-- System Info Header -->
    <div class="sys-info-card" id="sys-info-card">
        <div class="sys-info-header">
            <span id="sys-node">Host</span>
            <span id="sys-os">OS</span>
        </div>
        <div id="sys-release">Kernel</div>
        <div id="sys-machine">Arch</div>
    </div>

    <div class="stats-grid">
        <!-- CPU Card -->
        <div class="stat-card">
            <div class="stat-label">
                <span>TOTAL CPU</span>
                <div class="status-dot dot-blue"></div>
            </div>
            <div id="stat-cpu-value" class="stat-value">--%</div>
            <div class="progress-track">
                <div id="progress-cpu-fill" class="progress-fill fill-cpu" style="width: 0%"></div>
            </div>
        </div>

        <!-- Memory Card -->
        <div class="stat-card">
            <div class="stat-label">
                <span>MEMORY</span>
                <div class="status-dot dot-green"></div>
            </div>
            <div id="stat-mem-value" class="stat-value">--%</div>
            <div id="stat-mem-detail" class="stat-subtext">-- / -- GB</div>
            <div class="progress-track">
                <div id="progress-mem-fill" class="progress-fill fill-mem" style="width: 0%"></div>
            </div>
        </div>

        <!-- IP Card -->
        <div class="stat-card">
            <div class="stat-label"><span>IP ADDRESS</span></div>
            <div id="stat-ip-value" class="stat-value" style="font-size: 1em;">--</div>
        </div>

        <!-- Root Card -->
        <div class="stat-card">
            <div class="stat-label"><span>ROOT ACCESS</span></div>
            <div id="stat-root-value" class="stat-value">Checking...</div>
        </div>

        <!-- Vertical Cores -->
        <div class="cores-container">
            <div class="stat-label">
                <span>CPU CORES</span>
                <span id="core-count" class="stat-subtext">--</span>
            </div>
            <div id="cores-grid" class="cores-grid">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>
</div>
