version: "1"

shells:
  app-worker:
    backend: proc
    cwd: ${ctx:PROJECT_ROOT}
    command:
      - sh
      - -lc
      - |
        echo "Replace shellspec/app_worker.yaml command for your app worker"
        sleep infinity
    env:
      PYTHONPATH: ${env:PYTHONPATH}:${ctx:PROJECT_ROOT}
      TE_APP_ID: ${ctx:APP_ID}
      TE_APP_WORKER_PORT: "18080"
    subgroups:
      - ${ctx:APP_ID}
      - app-worker
    readiness:
      type: tcp_port
      host: 127.0.0.1
      port: 18080
      timeout: 20
