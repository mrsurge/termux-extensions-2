version: "1"

shells:
  app-worker:
    backend: proc
    cwd: ${ctx:PROJECT_ROOT}
    ui:
      subgroup_styles:
        aria2:
          bg: rgba(34, 197, 94, 0.10)
          border: rgba(34, 197, 94, 0.22)
    command:
      - python
      - -m
      - app.libs.app_worker
      - --app-id
      - ${ctx:APP_ID}
      - --port
      - ${free_port}
      - --backend-module
      - ${ctx:BACKEND_MODULE_PATH}
    env:
      PYTHONPATH: ${env:PYTHONPATH}:${ctx:PROJECT_ROOT}
      TE_APP_ID: ${ctx:APP_ID}
      TE_APP_WORKER_PORT: ${free_port}
    subgroups:
      - ${ctx:APP_ID}
      - app-worker
    readiness:
      type: tcp_port
      host: 127.0.0.1
      port: ${free_port}
      timeout: 10
