version: "1"

shells:
  code-server:
    backend: proc
    cwd: ${ctx:PROJECT_ROOT}
    command:
      - sh
      - -lc
      - >-
        code-server
        --bind-addr 127.0.0.1:${free_port}
        --auth none
        --config /dev/null
        --disable-telemetry
        --disable-update-check
        --user-data-dir "${ctx:CODE_SERVER_DATA_DIR}/user-data"
        --extensions-dir "${ctx:CODE_SERVER_DATA_DIR}/extensions"
        "${ctx:PROJECT_ROOT}"
    env:
      TE_APP_ID: ${ctx:APP_ID}
      TE_CODE_SERVER_PORT: ${free_port}
      PROJECT_ROOT: ${ctx:PROJECT_ROOT}
      TE_INSTANCE_ID: ${ctx:INSTANCE_ID}
      TE2_EXT_ROOT: ${env:TE2_EXT_ROOT}
      TE2_WORKER_API_BASE: ${env:TE2_WORKER_API_BASE}
      TE2_PROBE_OUT: ${ctx:CODE_SERVER_DATA_DIR}/te2-probe.jsonl
      NODE_OPTIONS: --require ${ctx:CODE_SERVER_DATA_DIR}/android-as-linux.js
    subgroups:
      - ${ctx:APP_ID}
      - code_server
      - "project:${ctx:PROJECT_HASH}"
    ui:
      subgroup_styles:
        code_server:
          bg: rgba(18, 23, 40, 0.92)
          border: rgba(90, 200, 250, 0.70)
        project:*:
          bg: rgba(0, 0, 0, 0.88)
          border: rgba(29, 70, 126, 0.88)
    readiness:
      type: tcp_port
      host: 127.0.0.1
      port: ${free_port}
      timeout: 60
