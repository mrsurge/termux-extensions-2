version: "1"

shells:
  app-worker:
    backend: proc
    cwd: ${ctx:PROJECT_ROOT}
    ui:
      subgroup_styles:
        lsp:
          bg: rgba(68, 45, 47, 0.80)
          border: rgba(168, 85, 247, 0.60)
        project:*:
          bg: rgba(0, 0, 0, 0.88)
          border: rgba(29, 70, 126, 0.88)
    command:
      - python
      - -m
      - app.libs.app_worker
      - --app-id
      - ${ctx:APP_ID}
      - --port
      - ${free_port}
      - --backend-module
      - ${ctx:BACKEND_MODULE_PATH}
    env:
      PYTHONPATH: ${env:PYTHONPATH}:${ctx:PROJECT_ROOT}
      TE_APP_ID: ${ctx:APP_ID}
      TE_APP_WORKER_PORT: ${free_port}
      FILE_EDITOR_CM6_EVENT_METRICS: "1"
    subgroups:
      - ${ctx:APP_ID}
      - app-worker
    readiness:
      type: tcp_port
      host: 127.0.0.1
      port: ${free_port}
      timeout: 10
