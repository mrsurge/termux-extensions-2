version: "1"

shells:
  # Android Kotlin LSP - Gradle-backed diagnostics
  # Spawned as a pipe shell for LSP stdio communication
  android-kotlin-lsp:
    backend: pipe
    cwd: ${ctx:PROJECT_ROOT}
    subgroups:
      - file_editor_cm6
      - lsp
      - android
      - "project:${ctx:PROJECT_HASH}"
    ui:
      subgroup_styles:
        android:
          bg: rgba(61, 220, 132, 0.15)
          border: rgba(61, 220, 132, 0.60)
        lsp:
          bg: rgba(68, 45, 47, 0.80)
          border: rgba(168, 85, 247, 0.60)
        project:*:
          bg: rgba(0, 0, 0, 0.88)
          border: rgba(29, 70, 126, 0.88)
    command:
      - ${ctx:ANDROID_LSP_BIN}
    env:
      ANDROID_HOME: ${env:ANDROID_HOME}
      ANDROID_SDK_ROOT: ${env:ANDROID_SDK_ROOT}
      JAVA_HOME: ${env:JAVA_HOME}
      PATH: ${env:PATH}
