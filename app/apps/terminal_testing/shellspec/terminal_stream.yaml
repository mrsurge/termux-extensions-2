version: "1"

shells:
  terminal-stream:
    backend: pipe
    pipe:
      mode: native_pipe_testing
    cwd: ${ctx:CWD}
    command:
      - sh
      - -lc
      - >-
        node "${ctx:BROKER_ENTRY}"
    env:
      TE_APP_ID: ${ctx:APP_ID}
      TERMINAL_STREAM_CWD: ${ctx:CWD}
      TERMINAL_STREAM_COLS: ${ctx:COLS}
      TERMINAL_STREAM_ROWS: ${ctx:ROWS}
      TERMINAL_STREAM_SHELL_CMD_JSON: ${ctx:SHELL_CMD_JSON}
    subgroups:
      - ${ctx:APP_ID}
      - terminal_stream
    ui:
      subgroup_styles:
        terminal_stream:
          bg: rgba(30, 22, 12, 0.92)
          border: rgba(220, 160, 80, 0.72)
