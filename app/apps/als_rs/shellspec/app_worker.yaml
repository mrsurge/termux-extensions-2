version: '1'
shells:
  app-worker:
    backend: pipe
    log_codecs: {stdout: messagepack, stderr: text}
    pipe:
      mode: native_pipe_testing
    command:
    - als-rs
    - --stdio
    - --port
    - '12459'
    env:
      TE_APP_ID: als-rs
      TE_APP_WORKER_PORT: '12459'
    subgroups:
    - als-rs
    - app-worker
