version: "1"

shells:
  workbench-adapter:
    backend: pipe
    pipe:
      mode: native_pipe_testing
    cwd: ${ctx:REPO_ROOT}
    command:
      - sh
      - -lc
      - >-
        bun "${ctx:WORKBENCH_ADAPTER_ENTRY}"
    env:
      TE_APP_ID: ${ctx:APP_ID}
      TE2_ADAPTER_HOST: 127.0.0.1
      TE2_ADAPTER_PORT: ${ctx:WORKBENCH_ADAPTER_PORT}
      TE2_CODE_SERVER_HTTP: ${ctx:CODE_SERVER_HTTP}
      TE2_CODE_SERVER_SOCKET: ${ctx:CODE_SERVER_SOCKET}
      TE2_EXTENSIONS_JSON: ${ctx:CODE_SERVER_EXTENSIONS_JSON}
      TE2_USER_SETTINGS_PATH: ${ctx:CODE_SERVER_USER_SETTINGS}
      TE2_EXTENSION_STORAGE_PATH: ${ctx:CODE_SERVER_EXTENSION_STORAGE}
      TE2_RPC_CONFIG_PATH: ${ctx:CODE_SERVER_RPC_CONFIG}
      TE2_REMOTE_AUTHORITY: ${ctx:REMOTE_AUTHORITY}

      # Active workspace (not the same as repo root).
      PROJECT_ROOT: ${ctx:PROJECT_ROOT}
      TE_INSTANCE_ID: ${ctx:INSTANCE_ID}
      TE2_EXT_ROOT: ${env:TE2_EXT_ROOT}
      TE2_WORKER_API_BASE: ${env:TE2_WORKER_API_BASE}
    subgroups:
      - ${ctx:APP_ID}
      - workbench_adapter
      - "project:${ctx:PROJECT_HASH}"
    ui:
      subgroup_styles:
        workbench_adapter:
          bg: rgba(18, 23, 40, 0.92)
          border: rgba(120, 180, 255, 0.70)
        project:*:
          bg: rgba(0, 0, 0, 0.88)
          border: rgba(29, 70, 126, 0.88)
    readiness:
      type: tcp_port
      host: 127.0.0.1
      port: ${ctx:WORKBENCH_ADAPTER_PORT}
      timeout: 20
