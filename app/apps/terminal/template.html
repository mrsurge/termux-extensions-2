<style>
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/static/fonts/jetbrains/webfonts/JetBrainsMono-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/static/fonts/jetbrains/webfonts/JetBrainsMono-Italic.woff2') format('woff2');
    font-weight: 400;
    font-style: italic;
    font-display: block;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/static/fonts/jetbrains/webfonts/JetBrainsMono-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/static/fonts/jetbrains/webfonts/JetBrainsMono-BoldItalic.woff2') format('woff2');
    font-weight: 700;
    font-style: italic;
    font-display: block;
  }
  .fe-menu {
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .fe-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 180px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    display: none;
    z-index: 400 !important;
  }
  .fe-dropdown.show { display: block; }
  .fe-dd-item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px;
    cursor: pointer;
    align-items: center;
    font-size: 0.95rem;
  }
  .fe-dd-item:hover { background: rgba(255,255,255,0.06); }
  .fe-dd-item-label {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .fe-dd-item-note {
    font-size: 0.78rem;
    color: var(--muted-foreground);
  }
  .ta-shell-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    background: var(--card);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .ta-shell-item:hover { border-color: var(--accent); }
  .ta-shell-item.active { border-color: var(--primary); background: rgba(80,120,255,0.08); }
  .ta-status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  .ta-dot-alive { background: var(--success); }
  .ta-dot-dead { background: var(--destructive); }
  .ta-shell-main {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1 1 auto;
    min-width: 0;
  }
  .ta-shell-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
  }
  .ta-shell-remove {
    font-size: 0.8em;
    padding: 4px 8px;
  }
  .ta-shell-title {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    color: var(--foreground);
  }
  .ta-shell-meta {
    font-size: 0.8em;
    color: var(--muted-foreground);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .ta-badge {
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 999px;
    font-size: 0.75em;
    color: var(--muted-foreground);
  }
  .ta-status-pill {
    min-width: 1.8em;
    padding: 2px 7px;
    border: 1px solid var(--border);
    border-radius: 999px;
    text-align: center;
    line-height: 1.2;
  }
  .mode-list #ta-terminal-container { display: none !important; }
  .mode-terminal #ta-terminal-container { display: flex; flex-direction: column; }
  .mode-list #ta-list-container { position: static; transform: none; max-height: 70vh; overflow: auto; }
  .mode-terminal #ta-list-container {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 80%;
    max-width: 320px;
    background: var(--card);
    border-right: 1px solid var(--border);
    padding: 8px;
    transform: translateX(-100%);
    transition: transform 160ms ease;
    z-index: 300;
  }
  .drawer-open #ta-list-container { transform: translateX(0); }
  #ta-drawer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 290;
  }
  .drawer-open #ta-drawer-overlay { display: block; }
  .ta-list-scroll { max-height: calc(100vh - 120px); overflow: auto; }
  #ta-keys {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 0;
    margin: 0;
    padding: 0;
    border: 0;
    background: var(--card);
  }
  #ta-keys .kbtn {
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    min-height: 44px;
    font-size: 0.85em;
    padding: 8px 2px calc(env(safe-area-inset-bottom, 0px) + 8px);
    border: 0;
    background: var(--secondary);
    color: var(--foreground);
    border-radius: 0;
    touch-action: manipulation;
    user-select: none;
  }
  #ta-keys .kbtn.toggle { background: var(--accent); color: var(--primary-foreground); }
  #ta-keys .kbtn:focus { outline: none; }
  .terminal-app {
    height: 100%;
    min-height: 100%;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: contain;
  }
  #ta-terminal-container {
    flex: 1 1 auto;
    min-height: 0;
    height: 100%;
    border: none !important;
    border-radius: 0 !important;
    padding: 0 !important;
    background: var(--background);
  }
  #ta-shell-header {
    margin: 0 !important;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  #ta-term {
    flex: 1 1 auto;
    min-height: 0;
    border: none !important;
    border-radius: 0 !important;
    padding: 0 !important;
    position: relative;
    background: var(--background);
  }
  #ta-term .xterm {
    width: 100%;
    height: 100%;
  }
  .ta-new-menu .fe-dropdown {
    min-width: 210px;
  }
</style>
<div class="terminal-app" style="display:flex; flex-direction:column; gap:0;">
  <div id="ta-list-container" class="ta-list-container">
    <div class="section-header">
      <h3 class="section-title">Terminal</h3>
      <div style="display:flex; gap:8px; align-items:center;">
        <div class="fe-menu ta-new-menu">
          <button id="ta-btn-new" class="app-btn" aria-haspopup="menu" aria-expanded="false">New Terminal</button>
          <div id="ta-btn-new-dd" class="fe-dropdown" role="menu" aria-label="New terminal type">
            <div class="fe-dd-item" data-terminal-kind="python" role="menuitem" tabindex="0">
              <div class="fe-dd-item-label">
                <span>Python</span>
                <span class="fe-dd-item-note">Default</span>
              </div>
            </div>
            <div class="fe-dd-item" data-terminal-kind="native" role="menuitem" tabindex="0">
              <div class="fe-dd-item-label">
                <span>Native</span>
                <span class="fe-dd-item-note">Native path</span>
              </div>
            </div>
            <div class="fe-dd-item" data-terminal-kind="node" role="menuitem" tabindex="0">
              <div class="fe-dd-item-label">
                <span>Node</span>
                <span class="fe-dd-item-note">Node path</span>
              </div>
            </div>
          </div>
        </div>
        <button id="ta-btn-refresh" class="app-btn">Refresh</button>
      </div>
    </div>
    <div class="ta-list-scroll">
      <div style="font-size:0.85em; color:var(--muted-foreground); margin-bottom:8px;">Shells</div>
      <div id="ta-shell-list"></div>
    </div>
  </div>

  <div id="ta-terminal-container" style="min-height:40vh;">
    <div id="ta-shell-header" style="display:flex; align-items:center; gap:8px;">
      <button id="ta-btn-menu" class="app-btn">&#9776;</button>
      <span id="ta-shell-title" style="font-weight:600;">No shell selected</span>
      <span id="ta-shell-status" class="ta-status-pill" aria-label=""></span>
      <div class="spacer"></div>
      <button id="ta-zoom-out" class="app-btn" type="button" tabindex="-1" title="Zoom out" aria-label="Zoom out">A−</button>
      <button id="ta-zoom-in" class="app-btn" type="button" tabindex="-1" title="Zoom in" aria-label="Zoom in">A+</button>
      <button id="ta-btn-stop" class="app-btn">Stop</button>
      <button id="ta-btn-kill" class="app-btn">Kill</button>
      <button id="ta-btn-remove" class="app-btn">Remove</button>
    </div>

    <div id="ta-term" style="flex:1 1 auto; overflow:hidden;"></div>

    <div id="ta-keys">
      <button id="k-ctrl" class="kbtn" type="button" tabindex="-1">Ctrl</button>
      <button id="k-tab" class="kbtn" type="button" tabindex="-1">Tab</button>
      <button id="k-esc" class="kbtn" type="button" tabindex="-1">Esc</button>
      <button id="k-left" class="kbtn" type="button" tabindex="-1">&#8592;</button>
      <button id="k-up" class="kbtn" type="button" tabindex="-1">&#8593;</button>
      <button id="k-down" class="kbtn" type="button" tabindex="-1">&#8595;</button>
      <button id="k-right" class="kbtn" type="button" tabindex="-1">&#8594;</button>
    </div>
  </div>
  <div id="ta-drawer-overlay"></div>
</div>
