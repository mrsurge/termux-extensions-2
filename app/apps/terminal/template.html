<style>
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/static/fonts/jetbrains/webfonts/JetBrainsMono-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/static/fonts/jetbrains/webfonts/JetBrainsMono-Italic.woff2') format('woff2');
    font-weight: 400;
    font-style: italic;
    font-display: block;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/static/fonts/jetbrains/webfonts/JetBrainsMono-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/static/fonts/jetbrains/webfonts/JetBrainsMono-BoldItalic.woff2') format('woff2');
    font-weight: 700;
    font-style: italic;
    font-display: block;
  }
  .ta-shell-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    background: var(--card);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .ta-shell-item:hover { border-color: var(--accent); }
  .ta-shell-item.active {
    border-color: var(--primary);
    background: rgba(80,120,255,0.16);
    box-shadow: inset 4px 0 0 var(--primary), 0 0 0 1px var(--primary);
  }
  .ta-shell-item.active .ta-shell-title { color: var(--primary); }
  .ta-status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  .ta-dot-alive { background: var(--success); }
  .ta-dot-dead { background: var(--destructive); }
  .ta-shell-main {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1 1 auto;
    min-width: 0;
  }
  .ta-shell-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
  }
  .ta-shell-remove {
    font-size: 0.8em;
    padding: 4px 8px;
  }
  .ta-shell-title {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    color: var(--foreground);
  }
  .ta-shell-meta {
    font-size: 0.8em;
    color: var(--muted-foreground);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .ta-badge {
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 999px;
    font-size: 0.75em;
    color: var(--muted-foreground);
  }
  .ta-status-pill {
    min-width: 1.8em;
    padding: 2px 7px;
    border: 1px solid var(--border);
    border-radius: 999px;
    text-align: center;
    line-height: 1.2;
  }
  .mode-list #ta-terminal-container { display: none !important; }
  .mode-terminal #ta-terminal-container { display: flex; flex-direction: column; }
  .mode-list #ta-list-container { position: static; transform: none; max-height: 70vh; overflow: auto; }
  .mode-terminal #ta-list-container {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 80%;
    max-width: 320px;
    background: var(--card);
    border-right: 1px solid var(--border);
    padding: 8px;
    transform: translateX(-100%);
    /* Template insertion/restoration is layout, not a drawer gesture. */
    transition: none;
    z-index: 300;
  }
  .mode-terminal.drawer-motion-enabled #ta-list-container {
    transition: transform 160ms ease;
  }
  .drawer-open #ta-list-container { transform: translateX(0); }
  #ta-drawer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 290;
  }
  .drawer-open #ta-drawer-overlay { display: block; }
  .ta-list-scroll { max-height: calc(100vh - 120px); overflow: auto; }
  /* The standalone PTY uses the viewport's real scrollbar for scrollback. */
  .terminal-app :is(#ta-list-container, .ta-list-scroll, .xterm-viewport),
  .ta-profile-dialog :is(.fe-modal-body, .run-profiles-list-items, .run-profiles-editor),
  .ta-profile-menu {
    scrollbar-width: thin;
    scrollbar-color: rgba(148, 163, 184, 0.58) transparent;
  }
  .ta-list-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    color: var(--muted-foreground);
    font-size: 0.85em;
  }
  .ta-show-exited {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    user-select: none;
  }
  #ta-keys {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 0;
    margin: 0;
    padding: 0;
    border: 0;
    background: var(--card);
  }
  #ta-keys[hidden] { display: none; }
  #ta-keys .kbtn {
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    min-height: 44px;
    font-size: 0.85em;
    padding: 7px 2px;
    border: 0;
    background: var(--secondary);
    color: var(--foreground);
    border-radius: 0;
    touch-action: manipulation;
    user-select: none;
  }
  #ta-keys .kbtn:nth-child(n + 8) {
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 7px);
  }
  #ta-keys .kbtn.toggle { background: var(--accent); color: var(--primary-foreground); }
  #ta-keys .kbtn.locked { box-shadow: inset 0 0 0 2px var(--primary); }
  #ta-keys .kbtn:focus { outline: none; }
  #ta-key-toggle.toggle {
    border-color: var(--primary);
    color: var(--primary);
  }
  .terminal-app {
    height: 100%;
    min-height: 100%;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: contain;
  }
  #ta-terminal-container {
    flex: 1 1 auto;
    min-height: 0;
    height: 100%;
    border: none !important;
    border-radius: 0 !important;
    padding: 0 !important;
    background: var(--background);
  }
  #ta-shell-header {
    margin: 0 !important;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  #ta-term {
    flex: 1 1 auto;
    min-height: 0;
    border: none !important;
    border-radius: 0 !important;
    padding: 0 !important;
    position: relative;
    background: var(--background);
  }
  #ta-term .xterm {
    width: 100%;
    height: 100%;
  }
  .mode-terminal #ta-new-with-profile { display:none }
  #ta-list-container .section-header, #ta-list-container .ta-launch-actions { flex-wrap:wrap }
  .ta-profile-dialog {position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:rgb(0 0 0 / .5)}
  .ta-profile-dialog.show {display:flex}
  .ta-profile-dialog .fe-modal-card {box-sizing:border-box;display:flex;flex-direction:column;width:min(940px,94vw);max-height:86dvh;overflow:hidden;color:var(--foreground);background:var(--card);border:1px solid var(--border);border-radius:10px}
  #ta-profile-picker .fe-modal-card {width:min(440px,94vw)}
  .ta-profile-dialog .fe-modal-header,.ta-profile-dialog .declarative-modal-footer {display:flex;flex:none;align-items:center;gap:8px;padding:10px 12px}
  .ta-profile-dialog .fe-modal-header {border-bottom:1px solid var(--border)}
  .ta-profile-dialog .declarative-modal-footer {justify-content:flex-end;border-top:1px solid var(--border)}
  .ta-profile-dialog .fe-modal-body {padding:16px 20px;overflow:auto}
  .ta-profile-dialog .fe-btn {background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:4px;padding:5px 8px;cursor:pointer}
  .ta-profile-fields,.ta-profile-fields label {display:grid; gap:6px}
  .ta-env-row {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) auto;gap:6px;margin:6px 0}
  .ta-profile-fields input:not([type=checkbox]),.ta-profile-fields textarea {box-sizing:border-box;width:100%;font:inherit;color:inherit;background:var(--background);border:1px solid var(--border);border-radius:6px;padding:6px}
  .ta-profile-picker button {display:block;width:100%;text-align:start}
  .fe-dropdown.ta-profile-menu {position:fixed;inset:auto;margin:0;padding:0;min-width:180px;max-width:90vw;max-height:80dvh;overflow:auto;color:var(--foreground,#e5e7eb);background:var(--card,#0b0f1a);border:1px solid var(--border,#333);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .ta-profile-menu .fe-dd-item {display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:8px 12px;border:0;border-radius:0;background:transparent;color:inherit;font:inherit;font-size:.9rem;text-align:start;cursor:pointer}
  .ta-profile-menu .fe-dd-item:is(:hover,:focus-visible) {background:rgba(255,255,255,.06)}
  .ta-profile-menu .fe-dd-item[data-checkable] {position:relative;padding-left:32px}
  .ta-profile-menu .fe-menu-item-checked {color:var(--primary,#3b82f6)}
  .ta-profile-menu .fe-menu-item-checked::before {content:'✓';position:absolute;left:12px;width:1em;text-align:center}
</style>
<div class="terminal-app" style="display:flex; flex-direction:column; gap:0;">
  <div id="ta-list-container" class="ta-list-container">
    <div class="section-header">
      <h3 class="section-title">Terminal</h3>
      <div class="ta-launch-actions" style="display:flex; gap:8px; align-items:center;">
        <button id="ta-btn-new" class="app-btn">New Terminal</button>
        <button id="ta-new-with-profile" class="app-btn">New with profile…</button>
        <button id="ta-profiles" class="app-btn">Profiles…</button>
      </div>
    </div>
    <div class="ta-list-scroll">
      <div class="ta-list-controls">
        <span>Shells</span>
        <label class="ta-show-exited">
          <input id="ta-show-exited" type="checkbox">
          <span>Show exited</span>
        </label>
      </div>
      <div id="ta-shell-list"></div>
    </div>
  </div>

  <div id="ta-terminal-container" style="min-height:40vh;">
    <div id="ta-shell-header" style="display:flex; align-items:center; gap:8px;">
      <button id="ta-btn-menu" class="app-btn">&#9776;</button>
      <span id="ta-shell-title" style="font-weight:600;">No shell selected</span>
      <span id="ta-shell-status" class="ta-status-pill" aria-label=""></span>
      <div class="spacer"></div>
      <button id="ta-zoom-out" class="app-btn" type="button" tabindex="-1" title="Zoom out" aria-label="Zoom out">A−</button>
      <button id="ta-zoom-in" class="app-btn" type="button" tabindex="-1" title="Zoom in" aria-label="Zoom in">A+</button>
      <button id="ta-key-toggle" class="app-btn" type="button" tabindex="-1" aria-pressed="true" hidden>Keys</button>
      <button id="ta-btn-stop" class="app-btn">End shell</button>
    </div>

    <div id="ta-term" style="flex:1 1 auto; overflow:hidden;"></div>
    <button id="ta-exit-prompt" class="app-btn" hidden>Press Enter to exit</button>

    <div id="ta-keys" hidden>
      <button id="k-esc" class="kbtn" type="button" tabindex="-1">ESC</button>
      <button id="k-shift" class="kbtn" type="button" tabindex="-1" aria-label="Shift next key" aria-pressed="false">SHIFT</button>
      <button id="k-dash" class="kbtn" type="button" tabindex="-1">-</button>
      <button id="k-home" class="kbtn" type="button" tabindex="-1">HOME</button>
      <button id="k-up" class="kbtn" type="button" tabindex="-1" aria-label="Up">&#8593;</button>
      <button id="k-end" class="kbtn" type="button" tabindex="-1">END</button>
      <button id="k-page-up" class="kbtn" type="button" tabindex="-1">PGUP</button>
      <button id="k-tab" class="kbtn" type="button" tabindex="-1">TAB</button>
      <button id="k-ctrl" class="kbtn" type="button" tabindex="-1" aria-pressed="false">CTRL</button>
      <button id="k-alt" class="kbtn" type="button" tabindex="-1" aria-pressed="false">ALT</button>
      <button id="k-left" class="kbtn" type="button" tabindex="-1">&#8592;</button>
      <button id="k-down" class="kbtn" type="button" tabindex="-1">&#8595;</button>
      <button id="k-right" class="kbtn" type="button" tabindex="-1">&#8594;</button>
      <button id="k-page-down" class="kbtn" type="button" tabindex="-1">PGDN</button>
    </div>
  </div>
  <div id="ta-drawer-overlay"></div>
</div>
