version: "1"

shells:
  app-worker:
    backend: proc
    cwd: ${ctx:PROJECT_ROOT}
    command:
      - sh
      - -lc
      - cd worktrees/agent_log_server/ && python server.py --log app-server.log --port 12359 --host 127.0.0.1 --debug --broadcast-all
    env:
      PYTHONPATH: ${env:PYTHONPATH}:${ctx:PROJECT_ROOT}
      TE_APP_ID: ${ctx:APP_ID}
      TE_APP_WORKER_PORT: "12359"
    subgroups:
      - ${ctx:APP_ID}
      - app-worker
    readiness:
      type: tcp_port
      host: 127.0.0.1
      port: 12359
      timeout: 20
