version: "1"

shells:
  app-worker:
    backend: pipe
    pipe:
      mode: native_pipe_testing
    cwd: ${ctx:PROJECT_ROOT}
    command:
      - python
      - -m
      - app.libs.app_worker
      - --app-id
      - ${ctx:APP_ID}
      - --port
      - ${free_port}
      - --backend-module
      - ${ctx:BACKEND_MODULE_PATH}
      - --pipe
    env:
      PYTHONPATH: ${env:PYTHONPATH}:${ctx:PROJECT_ROOT}
      TE_APP_ID: ${ctx:APP_ID}
      TE_APP_WORKER_PORT: ${free_port}
      TE_PIPE_NAME: service.fs
      TE_PIPE_NID: "2100"
    subgroups:
      - ${ctx:APP_ID}
      - app-worker
      - service.fs
    readiness:
      type: tcp_port
      host: 127.0.0.1
      port: ${free_port}
      timeout: 10
