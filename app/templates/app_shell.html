<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termux App</title>
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icon.png">
    <meta name="theme-color" content="#4caf50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: hsl(224, 71%, 4%);
            --foreground: hsl(213, 31%, 91%);
            --card: hsl(224, 71%, 7%);
            --border: hsl(216, 34%, 17%);
            --primary: hsl(217, 91%, 60%);
            --secondary: hsl(222, 84%, 11%);
            --muted-foreground: hsl(215, 13%, 65%);
        }
        body { margin: 0; background-color: var(--background); color: var(--foreground); font-family: 'Inter', sans-serif; }
        .app-shell { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        .app-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--card); position: sticky; top: 0; z-index: 5; }
        .app-title { font-weight: 600; margin-left: 6px; color: var(--foreground); }
        .spacer { flex: 1; }
        .app-btn { background: var(--secondary); color: var(--foreground); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
        .app-btn:hover { border-color: var(--primary); }
        #app-container { flex: 1; overflow: auto; }

        .app-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .app-modal-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: min(500px, 90vw);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
        }
        .app-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
        }
        .app-modal-header h3 { margin: 0; }
        .app-modal-body {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .recents-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--secondary);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .recents-icon { font-size: 1.5rem; }
        .recents-info { flex: 1; }
        .recents-name { font-weight: 600; }
        .recents-stats {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--muted-foreground);
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

    </style>
</head>
<body>
    <div class="app-shell">
        <div class="app-toolbar">
            <button id="btn-home" class="app-btn">Home</button>
            <button id="btn-reload" class="app-btn">Reload</button>
            <button id="btn-recents" class="app-btn">Recents</button>
            <button id="btn-lock" class="app-btn">Lock</button>
            <button id="btn-quit" class="app-btn">Quit</button>
            <div class="spacer"></div>
            <span id="app-title" class="app-title">App</span>
        </div>
        <div id="app-container"></div>
    </div>

    <div id="recents-modal" class="app-modal" style="display: none;">
        <div class="app-modal-content">
            <div class="app-modal-header">
                <h3>Recent Apps</h3>
                <button id="recents-close-btn" class="app-btn">&times;</button>
            </div>
            <div id="recents-list" class="app-modal-body"></div>
        </div>
    </div>


    <script type="module" src="/static/js/te_state.js"></script>
    <script type="module" src="/static/js/te_ui.js"></script>
    <script type="module" src="/static/js/jobs_client.js"></script>
    <script type="module" src="/static/js/file_picker.js"></script>
    <script id="__app_id_json" type="application/json">{{ app_id|tojson }}</script>
    <script type="module">
        const SETTINGS_ENDPOINT = '/api/settings';

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        const appContainer = document.getElementById('app-container');
        const appTitleEl = document.getElementById('app-title');
        const btnHome = document.getElementById('btn-home');
        const btnReload = document.getElementById('btn-reload');
        const appId = JSON.parse(document.getElementById('__app_id_json').textContent);
        let debugFullStack = false;

        // Minimal teFetch helper for the app shell
        async function teFetch(url, options) {
            const response = await fetch(url, options);
            const body = await response.json().catch(() => ({}));
            if (!response.ok || !body.ok) {
                throw new Error(body.error || `HTTP ${response.status} - ${response.statusText}`);
            }
            return body.data;
        }

        async function fetchSettings() {
            try {
                const data = await teFetch(SETTINGS_ENDPOINT);
                return data && typeof data === 'object' ? data : {};
            } catch (err) {
                console.warn('Failed to load settings', err);
                return {};
            }
        }

        const teStateStore = window.teState || null;
        const stateCache = new Map();

        function getStateKey() { return `app_state:${appId}`; }
        const stateKey = getStateKey();

        async function ensureStatePreloaded(key) {
            if (!teStateStore || stateCache.has(key)) return;
            try {
                await teStateStore.preload([key]);
                if (teStateStore.has(key)) {
                    stateCache.set(key, teStateStore.getSync(key, null));
                }
            } catch (err) {
                console.warn('Failed to preload app state', err);
            }
        }

        function getCachedState(key, defaultValue = null) {
            if (stateCache.has(key)) {
                const value = stateCache.get(key);
                return value === undefined ? defaultValue : value;
            }
            if (teStateStore && teStateStore.has(key)) {
                const value = teStateStore.getSync(key, defaultValue);
                stateCache.set(key, value);
                return value;
            }
            return defaultValue;
        }

        function persistStateSet(key, value) {
            if (!teStateStore) return;
            const op = teStateStore.set(key, value);
            if (op && typeof op.catch === 'function') {
                op.catch((err) => console.warn('Failed to persist app state', err));
            }
        }

        function persistStateRemove(key) {
            if (!teStateStore) return;
            const op = teStateStore.remove(key);
            if (op && typeof op.catch === 'function') {
                op.catch((err) => console.warn('Failed to clear app state', err));
            }
        }

        // Host API exposed to apps
        const host = {
            id: appId,
            saveState: (state) => {
                stateCache.set(stateKey, state);
                persistStateSet(stateKey, state);
                return true;
            },
            loadState: (defaultValue = null) => {
                return getCachedState(stateKey, defaultValue);
            },
            clearState: () => {
                stateCache.delete(stateKey);
                persistStateRemove(stateKey);
            },
            setTitle: (title) => { document.title = title || 'Termux App'; appTitleEl.textContent = title || 'App'; },
            onBeforeExit: (handler) => { window.__appBeforeExitHandler = handler; },
            toast: (msg) => { try { if (window.teUI && window.teUI.toast) window.teUI.toast(msg); } catch (_) {} },
        };

        async function attemptExit(navigateFn) {
            try {
                const handler = window.__appBeforeExitHandler;
                if (typeof handler === 'function') {
                    const res = await Promise.resolve(handler());
                    if (res && typeof res === 'object') {
                        if (res.cancel) return; // abort navigation
                        if ('state' in res) host.saveState(res.state);
                        else host.saveState(res);
                    } else if (res !== undefined) {
                        host.saveState(res);
                    }
                }
            } catch (e) {
                console.error('beforeExit handler error:', e);
            }
            navigateFn();
        }

        window.addEventListener('beforeunload', (e) => {
            const handler = window.__appBeforeExitHandler;
            if (typeof handler === 'function') {
                try { const res = handler(); if (res && res.cancel) { e.preventDefault(); e.returnValue = ''; } } catch (_) {}
            }
        });

        const btnQuit = document.getElementById('btn-quit');
        const btnLock = document.getElementById('btn-lock');
        const btnRecents = document.getElementById('btn-recents');
        const recentsModal = document.getElementById('recents-modal');
        const recentsList = document.getElementById('recents-list');
        const recentsCloseBtn = document.getElementById('recents-close-btn');


        let isLocked = false; // Assume default is unlocked

        btnHome.addEventListener('click', () => attemptExit(() => { window.location.href = '/'; }));
        btnReload.addEventListener('click', () => attemptExit(() => { window.location.reload(); }));

        if (btnQuit) {
            btnQuit.addEventListener('click', () => {
                fetch(`/api/apps/${appId}/quit`, {
                    method: "POST",
                }).catch(err => console.error('Failed to send quit signal:', err));
                // Navigate home immediately
                window.location.href = '/';
            });
        }

        if (btnLock) {
            btnLock.addEventListener('click', () => {
                isLocked = !isLocked;
                const endpoint = isLocked ? 'lock' : 'unlock';
                fetch(`/api/apps/${appId}/${endpoint}`, { method: 'POST' })
                    .then(res => res.json())
                    .then(body => {
                        if (body.ok) {
                            host.toast(`App ${isLocked ? 'locked' : 'unlocked'}`);
                            btnLock.textContent = isLocked ? 'Unlock' : 'Lock';
                        } else {
                            host.toast(`Error: ${body.error}`);
                            isLocked = !isLocked; // Revert state on failure
                        }
                    })
                    .catch(err => {
                        host.toast(`Error: ${err.message}`);
                        isLocked = !isLocked; // Revert state on failure
                    });
            });
        }

        if (btnRecents) {
            const formatUptime = (seconds) => {
                if (seconds < 60) return `${Math.floor(seconds)}s`;
                if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
                return `${Math.floor(seconds / 3600)}h`;
            };
            const formatRam = (bytes) => {
                if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
                return `${(bytes / (1024 * 1024)).toFixed(0)} MB`;
            };

            btnRecents.addEventListener('click', async () => {
                try {
                    const runningApps = await teFetch('/api/apps/running');
                    recentsList.innerHTML = '';
                    if (runningApps && runningApps.length > 0) {
                        runningApps.forEach(app => {
                            const card = document.createElement('div');
                            card.className = 'recents-card';
                            card.dataset.appId = app.app_id;
                            card.style.cursor = 'pointer';
                            card.innerHTML = `
                                <div class="recents-icon">${app.icon_emoji || '⚙️'}</div>
                                <div class="recents-info">
                                    <div class="recents-name">${app.name || app.app_id}</div>
                                    <div class="recents-stats">
                                        <span>Uptime: ${formatUptime(app.uptime)}</span>
                                        <span>CPU: ${app.cpu.toFixed(1)}%</span>
                                        <span>RAM: ${formatRam(app.ram)}</span>
                                    </div>
                                </div>
                            `;
                            card.addEventListener('click', () => {
                                const targetAppId = card.dataset.appId;
                                if (targetAppId) {
                                    recentsModal.style.display = 'none';
                                    window.location.href = `/app/${targetAppId}`;
                                }
                            });
                            recentsList.appendChild(card);
                        });
                    } else {
                        recentsList.innerHTML = '<p style="color: var(--muted-foreground);">No other apps are running.</p>';
                    }
                    recentsModal.style.display = 'flex';
                } catch (err) {
                    host.toast(`Error: ${err.message}`);
                }
            });

            recentsCloseBtn.addEventListener('click', () => {
                recentsModal.style.display = 'none';
            });
        }

        async function loadApp() {
            try {
                const response = await fetch('/api/apps');
                const result = await response.json();
                if (!result.ok) throw new Error(result.error);
                const appDef = result.data.find(a => a.id === appId);
                if (!appDef) throw new Error(`App with ID "${appId}" not found.`);

                host.setTitle(appDef.name || 'Termux App');
                await ensureStatePreloaded(stateKey);
                const templatePath = `/apps/${appDef._dir}/${appDef.entrypoints.frontend_template}`;
                const template = await fetch(templatePath).then(res => res.text());
                appContainer.innerHTML = template;

                if (appDef.entrypoints.frontend_script) {
                    const scriptPath = `/apps/${appDef._dir}/${appDef.entrypoints.frontend_script}`;
                    const module = await import(scriptPath);
                    const api = {
                        get: (endpoint) => teFetch(`/api/app/${appId}/${endpoint}`),
                        post: (endpoint, body) => teFetch(`/api/app/${appId}/${endpoint}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }),
                        delete: (endpoint) => teFetch(`/api/app/${appId}/${endpoint}`, { method: 'DELETE' })
                    };
                    // Pass host as a 3rd param (backward compatible)
                    const initResult = module.default(appContainer, api, host);
                    if (initResult && typeof initResult.then === 'function') {
                        await initResult;
                    }
                }
            } catch (error) {
                const details = debugFullStack && error?.stack ? error.stack : error.message;
                appContainer.innerHTML = `<pre style=\"color: red; white-space: pre-wrap;\">Error loading app: ${escapeHtml(details)}</pre>`;
                console.error("Failed to load app:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const settings = await fetchSettings();
                debugFullStack = !!settings.debugFullStack;
            } catch (err) {
                debugFullStack = false;
            }
            await loadApp();
        });
    </script>

        <script>
// Register Service Worker for PWA installability (app shell view)
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
            console.error('Service worker registration failed:', err);
        });
    });
}
        </script>
</body>
</html>
