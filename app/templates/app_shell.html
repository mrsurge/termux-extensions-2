<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termux App</title>
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icon.png">
    <meta name="theme-color" content="#4caf50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: hsl(224, 71%, 4%);
            --foreground: hsl(213, 31%, 91%);
            --card: hsl(224, 71%, 7%);
            --border: hsl(216, 34%, 17%);
            --primary: hsl(217, 91%, 60%);
            --secondary: hsla(220, 18%, 16%, 1.00);
            --muted-foreground: hsl(215, 13%, 65%);
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        body { background-color: var(--background); color: var(--foreground); font-family: 'Inter', sans-serif; }
        .app-shell { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        .app-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--card); position: sticky; top: 0; z-index: 5; }
        html.gv-native .app-toolbar { display: none; }
        html.te-embed .app-toolbar { display: none; }
        .app-title { font-weight: 600; margin-left: 6px; color: var(--foreground); font-size: 0.95rem; max-width: 45vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .spacer { flex: 1; }
        .app-btn { background: var(--secondary); color: var(--foreground); border: 1px solid var(--border); border-radius: 1px; padding: 6px 10px; cursor: pointer; }
        .app-btn:hover { border-color: var(--primary); }
        #app-container { flex: 1; overflow: auto; }

        .app-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .app-modal-content {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: min(500px, 90vw);
            max-height: 70vh;
            display: flex;
            flex-direction: column;
        }
        .app-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
        }
        .app-modal-header h3 { margin: 0; }
        .app-modal-actions { display: flex; align-items: center; gap: 8px; }
        .app-modal-body {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .recents-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--secondary);
            padding: 12px;
            border-radius: 2px;
            border: 1px solid var(--border);
        }
        .recents-icon {
            font-size: 1.5rem;
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
        }
        .recents-icon-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .recents-info { flex: 1; }
        .recents-name { font-weight: 600; }
        .recents-stats {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--muted-foreground);
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .recents-card.locked {
            border-color: var(--success);
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.35);
            background: rgba(34, 197, 94, 0.1);
        }

        .recents-card-quit-btn {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 28px;
            height: 28px;
            border-radius: 2%;
            background: rgba(80, 120, 255, 0.2);
            color: var(--primary-foreground);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5rem;
            cursor: pointer;
            z-index: 1;
        }

        .recents-card-lock-btn {
            background: rgba(80, 120, 255, 0.2);
            border: 1px solid var(--border);
            color: var(--foreground);
            width: 36px;
            height: 36px;
            border-radius: 2px%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .recents-card.locked .recents-card-lock-btn {
            background: var(--success);
            color: var(--primary-foreground);
        }

        .recents-exit-all-btn {
            width: 100%;
            padding: 12px;
            border-radius: 2px;
            background: rgba(80, 120, 255, 0.2);
            color: var(--primary-foreground);
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

    </style>
    <script>
    // GeckoView: persist gv-native mode across navigation so we never show two headers.
    (function () {
        let enabled = false;
        let embed = false;
        try {
            const p = new URLSearchParams(location.search);
            if (p.get('gv_native') === '1') {
                enabled = true;
                sessionStorage.setItem('te_gv_native', '1');
            } else if (sessionStorage.getItem('te_gv_native') === '1') {
                enabled = true;
            }

            // iframe embed mode (used by the TE2 side-bar shortcuts)
            const embedParam = p.get('embed');
            if (embedParam === '1' || embedParam === 'true') {
                embed = true;
            }
        } catch (e) {}

        if (enabled) {
            document.documentElement.classList.add('gv-native');
            try { console.log('[app_shell] gv-native enabled'); } catch (e) {}
        }

        if (embed) {
            document.documentElement.classList.add('te-embed');
            try { console.log('[app_shell] embed enabled'); } catch (e) {}
        }
    })();

    // Called by GeckoView native header to open the existing web Recents modal if present.
    window.teOpenRecentsModal = function () {
        const btn = document.getElementById('btn-recents');
        if (!btn) return false;
        btn.click();
        return true;
    };
    </script>
</head>
<body>
    <div class="app-shell">
        <div class="app-toolbar">
            <button id="btn-home" class="app-btn">Home</button>
            <button id="btn-reload" class="app-btn">Reload</button>
            <button id="btn-recents" class="app-btn">Recents</button>
            <button id="btn-lock" class="app-btn">Lock</button>
            <button id="btn-quit" class="app-btn">Quit</button>
            <div class="spacer"></div>
            <span id="app-title" class="app-title">App</span>
        </div>
        <div id="app-container"></div>
    </div>

    <div id="recents-modal" class="app-modal" style="display: none;">
        <div class="app-modal-content">
            <div class="app-modal-header">
                <h3>Recent Apps</h3>
                <div class="app-modal-actions">
                    <button id="recents-settings-btn" class="app-btn" title="Open Settings">🎛️</button>
                    <button id="recents-close-btn" class="app-btn">&times;</button>
                </div>
            </div>
            <div id="recents-list" class="app-modal-body"></div>
        </div>
    </div>


    <script src="{{ url_for('static', filename='js/ws_port.js') }}"></script>
    <script type="module" src="/static/js/te_state.js"></script>
    <script type="module" src="/static/js/te_ui.js"></script>
    <script type="module" src="/static/js/jobs_client.js"></script>
    <script type="module" src="/static/js/file_picker.js"></script>
    <script id="__app_id_json" type="application/json">{{ app_id|tojson }}</script>
    
    <script>
    // Framework toolbar height tracking - expose as CSS variable for all apps
    function updateFrameworkToolbarHeight() {
        const toolbar = document.querySelector('.app-toolbar');
        if (
            toolbar
            && !document.documentElement.classList.contains('gv-native')
            && !document.documentElement.classList.contains('te-embed')
        ) {
            const height = toolbar.offsetHeight;
            document.documentElement.style.setProperty('--framework-toolbar-height', `${height}px`);
        } else {
            document.documentElement.style.setProperty('--framework-toolbar-height', `0px`);
        }
    }
    
    // Run on load and resize
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', updateFrameworkToolbarHeight);
    } else {
        updateFrameworkToolbarHeight();
    }
    window.addEventListener('resize', updateFrameworkToolbarHeight);
    </script>
    
    <script type="module">
        const SETTINGS_ENDPOINT = '/api/settings';

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        const appContainer = document.getElementById('app-container');
        const appTitleEl = document.getElementById('app-title');
        const btnHome = document.getElementById('btn-home');
        const btnReload = document.getElementById('btn-reload');
        const appId = JSON.parse(document.getElementById('__app_id_json').textContent);
        let debugFullStack = false;

        // Minimal teFetch helper for the app shell
        async function teFetch(url, options) {
            const response = await fetch(url, options);
            const body = await response.json().catch(() => ({}));
            if (!response.ok || !body.ok) {
                throw new Error(body.error || `HTTP ${response.status} - ${response.statusText}`);
            }
            return body.data;
        }

        async function fetchSettings() {
            try {
                const data = await teFetch(SETTINGS_ENDPOINT);
                return data && typeof data === 'object' ? data : {};
            } catch (err) {
                console.warn('Failed to load settings', err);
                return {};
            }
        }

        const teStateStore = window.teState || null;
        const stateCache = new Map();

        function getStateKey() { return `app_state:${appId}`; }
        const stateKey = getStateKey();

        async function ensureStatePreloaded(key) {
            if (!teStateStore || stateCache.has(key)) return;
            try {
                await teStateStore.preload([key]);
                if (teStateStore.has(key)) {
                    stateCache.set(key, teStateStore.getSync(key, null));
                }
            } catch (err) {
                console.warn('Failed to preload app state', err);
            }
        }

        function getCachedState(key, defaultValue = null) {
            if (stateCache.has(key)) {
                const value = stateCache.get(key);
                return value === undefined ? defaultValue : value;
            }
            if (teStateStore && teStateStore.has(key)) {
                const value = teStateStore.getSync(key, defaultValue);
                stateCache.set(key, value);
                return value;
            }
            return defaultValue;
        }

        function persistStateSet(key, value) {
            if (!teStateStore) return;
            const op = teStateStore.set(key, value);
            if (op && typeof op.catch === 'function') {
                op.catch((err) => console.warn('Failed to persist app state', err));
            }
        }

        function persistStateRemove(key) {
            if (!teStateStore) return;
            const op = teStateStore.remove(key);
            if (op && typeof op.catch === 'function') {
                op.catch((err) => console.warn('Failed to clear app state', err));
            }
        }

        // Host API exposed to apps
        const host = {
            id: appId,
            saveState: (state) => {
                stateCache.set(stateKey, state);
                persistStateSet(stateKey, state);
                return true;
            },
            loadState: (defaultValue = null) => {
                return getCachedState(stateKey, defaultValue);
            },
            clearState: () => {
                stateCache.delete(stateKey);
                persistStateRemove(stateKey);
            },
            setTitle: (title) => { document.title = title || 'Termux App'; appTitleEl.textContent = title || 'App'; },
            onBeforeExit: (handler) => { window.__appBeforeExitHandler = handler; },
            toast: (msg) => { try { if (window.teUI && window.teUI.toast) window.teUI.toast(msg); } catch (_) {} },
        };

        async function attemptExit(navigateFn) {
            try {
                const handler = window.__appBeforeExitHandler;
                if (typeof handler === 'function') {
                    const res = await Promise.resolve(handler());
                    if (res && typeof res === 'object') {
                        if (res.cancel) return; // abort navigation
                        if ('state' in res) host.saveState(res.state);
                        else host.saveState(res);
                    } else if (res !== undefined) {
                        host.saveState(res);
                    }
                }
            } catch (e) {
                console.error('beforeExit handler error:', e);
            }
            navigateFn();
        }

        window.addEventListener('beforeunload', (e) => {
            const handler = window.__appBeforeExitHandler;
            if (typeof handler === 'function') {
                try { const res = handler(); if (res && res.cancel) { e.preventDefault(); e.returnValue = ''; } } catch (_) {}
            }
        });

        const btnQuit = document.getElementById('btn-quit');
        const btnLock = document.getElementById('btn-lock');
        const btnRecents = document.getElementById('btn-recents');
        const recentsModal = document.getElementById('recents-modal');
        const recentsList = document.getElementById('recents-list');
        const recentsCloseBtn = document.getElementById('recents-close-btn');
        const recentsSettingsBtn = document.getElementById('recents-settings-btn');


        let isLocked = false; // Assume default is unlocked

        btnHome.addEventListener('click', () => attemptExit(() => { window.location.href = '/'; }));
        btnReload.addEventListener('click', () => attemptExit(() => { window.location.reload(); }));

        if (btnQuit) {
            btnQuit.addEventListener('click', () => {
                fetch(`/api/apps/${appId}/quit`, {
                    method: "POST",
                }).catch(err => console.error('Failed to send quit signal:', err));
                // Navigate home immediately
                window.location.href = '/';
            });
        }

        if (btnLock) {
            btnLock.addEventListener('click', () => {
                isLocked = !isLocked;
                const endpoint = isLocked ? 'lock' : 'unlock';
                fetch(`/api/apps/${appId}/${endpoint}`, { method: 'POST' })
                    .then(res => res.json())
                    .then(body => {
                        if (body.ok) {
                            host.toast(`App ${isLocked ? 'locked' : 'unlocked'}`);
                            btnLock.textContent = isLocked ? 'Unlock' : 'Lock';
                        } else {
                            host.toast(`Error: ${body.error}`);
                            isLocked = !isLocked; // Revert state on failure
                        }
                    })
                    .catch(err => {
                        host.toast(`Error: ${err.message}`);
                        isLocked = !isLocked; // Revert state on failure
                    });
            });
        }

        if (btnRecents) {
            const formatUptime = (seconds) => {
                if (seconds < 60) return `${Math.floor(seconds)}s`;
                if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
                return `${Math.floor(seconds / 3600)}h`;
            };
            const formatRam = (bytes) => {
                if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
                return `${(bytes / (1024 * 1024)).toFixed(0)} MB`;
            };
            const withGvNative = (url) => {
                try {
                    if (!document.documentElement.classList.contains('gv-native')) return url;
                    const u = new URL(url, location.origin);
                    u.searchParams.set('gv_native', '1');
                    return u.pathname + u.search;
                } catch (e) {
                    return url;
                }
            };
            const resolveIconSrc = (app) => {
                const raw = typeof app.icon_src === 'string' ? app.icon_src.trim() : '';
                if (!raw) return '';
                if (raw.startsWith('http://') || raw.startsWith('https://') || raw.startsWith('/')) {
                    return raw;
                }
                if (app._dir) {
                    return `/apps/${app._dir}/${raw}`;
                }
                return raw;
            };

            btnRecents.addEventListener('click', async () => {
                try {
                    const runningApps = await teFetch('/api/apps/running');
                    recentsList.innerHTML = '';
                    if (runningApps && runningApps.length > 0) {
                        runningApps.forEach(app => {
                            const card = document.createElement('div');
                            card.className = 'recents-card';
                            if (app.locked) {
                                card.classList.add('locked');
                            }
                            card.dataset.appId = app.app_id;
                            card.dataset.shellId = app.shell_id;
                            card.style.position = 'relative'; // For positioning the quit button

                            // Add main click listener for app switching
                            card.addEventListener('click', () => {
                                const targetAppId = card.dataset.appId;
                                if (targetAppId) {
                                    recentsModal.style.display = 'none';
                                    window.location.href = withGvNative(`/app/${targetAppId}`);
                                }
                            });

                            card.innerHTML = `
                                <button class="recents-card-quit-btn" title="Quit App">❌</button>
                                <div class="recents-icon"></div>
                                <div class="recents-info">
                                    <div class="recents-name">${app.name || app.app_id}</div>
                                    <div class="recents-stats">
                                        <span>Uptime: ${formatUptime(app.uptime)}</span>
                                        <span>CPU: ${app.cpu.toFixed(1)}%</span>
                                        <span>RAM: ${formatRam(app.ram)}</span>
                                    </div>
                                </div>
                                <button class="recents-card-lock-btn" title="Toggle Lock">🔒</button>
                            `;
                            const iconContainer = card.querySelector('.recents-icon');
                            const iconSrc = resolveIconSrc(app);
                            if (iconContainer) {
                                if (iconSrc) {
                                    const img = document.createElement('img');
                                    img.className = 'recents-icon-img';
                                    img.alt = `${app.name || app.app_id || 'app'} icon`;
                                    img.src = iconSrc;
                                    img.loading = 'lazy';
                                    img.decoding = 'async';
                                    img.referrerPolicy = 'no-referrer';
                                    iconContainer.appendChild(img);
                                } else {
                                    iconContainer.textContent = app.icon_emoji || '⚙️';
                                }
                            }
                            recentsList.appendChild(card);
                        });

                        // Add event listeners for the new buttons
                        recentsList.querySelectorAll('.recents-card-quit-btn').forEach(btn => {
                            btn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                const card = btn.closest('.recents-card');
                                const appIdToQuit = card.dataset.appId;
                                if (appIdToQuit && confirm(`Quit ${appIdToQuit}? This will override any lock.`)) {
                                    fetch(`/api/apps/${appIdToQuit}/quit`, { method: 'POST' })
                                        .then(() => card.remove());
                                }
                            });
                        });

                        recentsList.querySelectorAll('.recents-card-lock-btn').forEach(btn => {
                            btn.addEventListener('click', async (e) => {
                                e.stopPropagation();
                                const card = btn.closest('.recents-card');
                                const appIdToToggle = card.dataset.appId;
                                const isCurrentlyLocked = card.classList.contains('locked');
                                const endpoint = isCurrentlyLocked ? 'unlock' : 'lock';
                                
                                try {
                                    await teFetch(`/api/apps/${appIdToToggle}/${endpoint}`, { method: 'POST' });
                                    // Re-render the list to show the change immediately
                                    btnRecents.click(); 
                                } catch (err) {
                                    host.toast(`Error: ${err.message}`);
                                }
                            });
                        });

                        const exitAllBtn = document.createElement('button');
                        exitAllBtn.className = 'recents-exit-all-btn';
                        exitAllBtn.innerHTML = '<span>❌</span> Exit All Apps';
                        exitAllBtn.addEventListener('click', async () => {
                            if (!confirm('Are you sure you want to exit all unlocked apps?')) return;
                            try {
                                const runningApps = await teFetch('/api/apps/running');
                                const unlockedApps = runningApps.filter(app => !app.locked);
                                for (const app of unlockedApps) {
                                    await fetch(`/api/apps/${app.app_id}/quit`, { method: 'POST' });
                                }
                                recentsModal.style.display = 'none';
                            } catch (err) {
                                host.toast(`Error: ${err.message}`);
                            }
                        });
                        recentsList.appendChild(exitAllBtn);

                    } else {
                        recentsList.innerHTML = '<p style="color: var(--muted-foreground);">No other apps are running.</p>';
                    }
                    recentsModal.style.display = 'flex';
                } catch (err) {
                    host.toast(`Error: ${err.message}`);
                }
            });

            recentsCloseBtn.addEventListener('click', () => {
                recentsModal.style.display = 'none';
            });
            recentsSettingsBtn?.addEventListener('click', () => {
                recentsModal.style.display = 'none';
                window.location.href = withGvNative('/app/settings');
            });
        }

        async function loadApp() {
            try {
                const response = await fetch('/api/apps');
                const result = await response.json();
                if (!result.ok) throw new Error(result.error);
                const appDef = result.data.find(a => a.id === appId);
                if (!appDef) throw new Error(`App with ID "${appId}" not found.`);

                host.setTitle(appDef.name || 'Termux App');
                await ensureStatePreloaded(stateKey);
                const templatePath = `/apps/${appDef._dir}/${appDef.entrypoints.frontend_template}`;
                const template = await fetch(templatePath).then(res => res.text());
                appContainer.innerHTML = template;

                if (appDef.entrypoints.frontend_script) {
                    const scriptPath = `/apps/${appDef._dir}/${appDef.entrypoints.frontend_script}`;
                    const module = await import(scriptPath);
                    const api = {
                        get: (endpoint) => teFetch(`/api/app/${appId}/${endpoint}`),
                        post: (endpoint, body) => teFetch(`/api/app/${appId}/${endpoint}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }),
                        delete: (endpoint) => teFetch(`/api/app/${appId}/${endpoint}`, { method: 'DELETE' })
                    };
                    // Pass host as a 3rd param (backward compatible)
                    const initResult = module.default(appContainer, api, host);
                    if (initResult && typeof initResult.then === 'function') {
                        await initResult;
                    }
                }
            } catch (error) {
                const details = debugFullStack && error?.stack ? error.stack : error.message;
                appContainer.innerHTML = `<pre style=\"color: red; white-space: pre-wrap;\">Error loading app: ${escapeHtml(details)}</pre>`;
                console.error("Failed to load app:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const settings = await fetchSettings();
                debugFullStack = !!settings.debugFullStack;
            } catch (err) {
                debugFullStack = false;
            }
            await loadApp();
        });
    </script>

        <script>
// Register Service Worker for PWA installability (app shell view)
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
            console.error('Service worker registration failed:', err);
        });
    });
}
        </script>
</body>
</html>
